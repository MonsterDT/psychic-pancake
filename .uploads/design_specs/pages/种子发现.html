<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>种子发现</title>
    <style id="theme-vars">
/* ===== Life Navigator — Warm Healing Design System ===== */
/* Brand prefix: ln */

:root {
  /* ── Primary: Warm Amber/Gold ── */
  --ln-color-primary: #C8860E;
  --ln-color-primary-light: #E5A830;
  --ln-color-primary-lighter: #F5DFA0;
  --ln-color-primary-lightest: #FFF8EB;
  --ln-color-primary-dark: #A06C08;
  --ln-color-primary-darker: #7A5206;

  /* ── Neutral Palette ── */
  --ln-color-bg: #FFFBF5;
  --ln-color-bg-warm: #FFF6E9;
  --ln-color-surface: #FFFFFF;
  --ln-color-surface-elevated: #FFFFFF;
  --ln-color-surface-muted: #F9F3EA;
  --ln-color-border: #E8DFD0;
  --ln-color-border-light: #F0E9DD;

  /* ── Text ── */
  --ln-color-text: #2D2A24;
  --ln-color-text-secondary: #6B6456;
  --ln-color-text-tertiary: #9E9586;
  --ln-color-text-inverse: #FFFFFF;
  --ln-color-text-on-primary: #FFFFFF;

  /* ── State Colors ── */
  --state-success: #3D8B5E;
  --state-warning: #D4952B;
  --state-error: #C45A4D;
  --state-info: #5B7FA5;

  /* ── Typography ── */
  --ln-font-display: 'Noto Serif SC', 'Georgia', serif;
  --ln-font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --ln-font-size-xs: 0.75rem;
  --ln-font-size-sm: 0.875rem;
  --ln-font-size-base: 1rem;
  --ln-font-size-lg: 1.125rem;
  --ln-font-size-xl: 1.25rem;
  --ln-font-size-2xl: 1.5rem;
  --ln-font-size-3xl: 1.875rem;
  --ln-font-size-4xl: 2.25rem;

  --ln-font-weight-normal: 400;
  --ln-font-weight-medium: 500;
  --ln-font-weight-semibold: 600;
  --ln-font-weight-bold: 700;

  --ln-line-height-tight: 1.3;
  --ln-line-height-normal: 1.6;
  --ln-line-height-relaxed: 1.8;

  /* ── Spacing ── */
  --ln-space-xs: 4px;
  --ln-space-sm: 8px;
  --ln-space-md: 16px;
  --ln-space-lg: 24px;
  --ln-space-xl: 32px;
  --ln-space-2xl: 48px;
  --ln-space-3xl: 64px;

  /* ── Shape ── */
  --ln-radius-sm: 6px;
  --ln-radius-md: 10px;
  --ln-radius-lg: 14px;
  --ln-radius-xl: 16px;
  --ln-radius-full: 9999px;

  /* ── Surface & Depth ── */
  --ln-shadow-sm: 0 1px 3px rgba(45, 42, 36, 0.04);
  --ln-shadow-md: 0 2px 8px rgba(45, 42, 36, 0.05);
  --ln-shadow-lg: 0 8px 24px rgba(45, 42, 36, 0.05);
  --ln-shadow-float: 0 12px 40px rgba(45, 42, 36, 0.12);

  /* ── Transition ── */
  --ln-transition-fast: 150ms ease;
  --ln-transition-normal: 250ms ease;
  --ln-transition-slow: 400ms ease;
}

/* ── Typography Classes ── */
.ln-h1 {
  font-family: var(--ln-font-display);
  font-size: var(--ln-font-size-4xl);
  font-weight: var(--ln-font-weight-bold);
  line-height: var(--ln-line-height-tight);
  color: var(--ln-color-text);
}

.ln-h2 {
  font-family: var(--ln-font-display);
  font-size: var(--ln-font-size-3xl);
  font-weight: var(--ln-font-weight-bold);
  line-height: var(--ln-line-height-tight);
  color: var(--ln-color-text);
}

.ln-h3 {
  font-family: var(--ln-font-display);
  font-size: var(--ln-font-size-2xl);
  font-weight: var(--ln-font-weight-semibold);
  line-height: var(--ln-line-height-normal);
  color: var(--ln-color-text);
}

.ln-h4 {
  font-family: var(--ln-font-body);
  font-size: var(--ln-font-size-xl);
  font-weight: var(--ln-font-weight-semibold);
  line-height: var(--ln-line-height-normal);
  color: var(--ln-color-text);
}

.ln-body {
  font-family: var(--ln-font-body);
  font-size: var(--ln-font-size-base);
  font-weight: var(--ln-font-weight-normal);
  line-height: var(--ln-line-height-relaxed);
  color: var(--ln-color-text-secondary);
}

.ln-caption {
  font-family: var(--ln-font-body);
  font-size: var(--ln-font-size-sm);
  font-weight: var(--ln-font-weight-normal);
  line-height: var(--ln-line-height-normal);
  color: var(--ln-color-text-tertiary);
}

.ln-label {
  font-family: var(--ln-font-body);
  font-size: var(--ln-font-size-xs);
  font-weight: var(--ln-font-weight-medium);
  line-height: var(--ln-line-height-normal);
  color: var(--ln-color-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--ln-color-primary);
    --color-primary-light: var(--ln-color-primary-light);
    --color-primary-lighter: var(--ln-color-primary-lighter);
    --color-primary-lightest: var(--ln-color-primary-lightest);
    --color-primary-dark: var(--ln-color-primary-dark);
    --color-surface: var(--ln-color-surface);
    --color-border: var(--ln-color-border);
    --color-border-light: var(--ln-color-border-light);
    --color-bg: var(--ln-color-bg);
    --color-bg-warm: var(--ln-color-bg-warm);
    --color-surface-muted: var(--ln-color-surface-muted);
    --color-text: var(--ln-color-text);
    --color-text-secondary: var(--ln-color-text-secondary);
    --color-text-tertiary: var(--ln-color-text-tertiary);
    --color-text-inverse: var(--ln-color-text-inverse);
    --color-text-on-primary: var(--ln-color-text-on-primary);
    --radius-sm: var(--ln-radius-sm);
    --radius-md: var(--ln-radius-md);
    --radius-lg: var(--ln-radius-lg);
    --radius-xl: var(--ln-radius-xl);
  }
  @layer base {
    body { background: var(--ln-color-bg); color: var(--ln-color-text); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen pb-24" style="background: var(--ln-color-bg);">

      <!-- Top Progress Bar Area -->
      <header class="sticky top-0 z-30 border-b" style="background: var(--ln-color-surface); border-color: var(--ln-color-border);">
        <div class="flex items-center gap-3 px-4 py-3">
          <button class="inline-flex items-center justify-center w-8 h-8 rounded-lg border" style="border-color: var(--ln-color-border); background: var(--ln-color-surface);" data-dom-id="btn-back" aria-label="返回">
            <i data-lucide="chevron-left" class="w-4 h-4" style="color: var(--ln-color-text-secondary);"></i>
          </button>
          <div class="flex-1 min-w-0">
            <p class="ln-caption" style="color: var(--ln-color-text-tertiary);">种子发现</p>
            <div class="flex items-center gap-2 mt-1">
              <div class="flex-1 h-1.5 rounded-full overflow-hidden" style="background: var(--ln-color-surface-muted);">
                <div class="h-full rounded-full transition-all duration-300" style="width: 16.67%; background: var(--ln-color-primary);"></div>
              </div>
              <span class="ln-caption whitespace-nowrap" style="color: var(--ln-color-primary);">1/6</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Dimension Tabs -->
      <div class="px-4 pt-4 pb-2">
        <nav class="flex gap-2 overflow-x-auto no-scrollbar" aria-label="评估维度">
          <button class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg whitespace-nowrap text-sm font-medium transition-colors duration-150" style="background: var(--ln-color-primary); color: var(--ln-color-text-on-primary);" data-dom-id="tab-passion" data-active="true" aria-current="true">
            <span class="text-base leading-none">&#x1F525;</span>
            <span>热情</span>
          </button>
          <button class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border whitespace-nowrap text-sm font-medium transition-colors duration-150" style="background: var(--ln-color-surface); border-color: var(--ln-color-border); color: var(--ln-color-text-secondary);" data-dom-id="tab-talent">
            <span class="text-base leading-none">&#x2B50;</span>
            <span>天赋</span>
          </button>
          <button class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border whitespace-nowrap text-sm font-medium transition-colors duration-150" style="background: var(--ln-color-surface); border-color: var(--ln-color-border); color: var(--ln-color-text-secondary);" data-dom-id="tab-social">
            <span class="text-base leading-none">&#x1F30D;</span>
            <span>社会需求</span>
          </button>
          <button class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border whitespace-nowrap text-sm font-medium transition-colors duration-150" style="background: var(--ln-color-surface); border-color: var(--ln-color-border); color: var(--ln-color-text-secondary);" data-dom-id="tab-value">
            <span class="text-base leading-none">&#x1F48E;</span>
            <span>价值实现</span>
          </button>
        </nav>
      </div>

      <!-- Question Card -->
      <section class="px-4 pt-3">
        <div class="rounded-2xl border p-5" style="background: var(--ln-color-surface); border-color: var(--ln-color-border-light);">

          <!-- Question Indicator -->
          <p class="ln-label text-center mb-4" style="letter-spacing: 0.05em;">第 1 题 / 共 6 题</p>

          <!-- Question Text -->
          <p class="text-center mb-6 text-lg leading-relaxed font-medium" style="font-family: var(--ln-font-display); color: var(--ln-color-text); text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">
            什么事情让你忘记了时间的流逝？
          </p>

          <!-- Options -->
          <div class="flex flex-col gap-3" role="radiogroup" aria-label="答题选项">

            <!-- Option A: Selected -->
            <button class="flex items-center gap-3 p-4 rounded-xl border-2 text-left transition-colors duration-150" style="border-color: var(--ln-color-primary); background: var(--ln-color-primary-lightest);" data-dom-id="option-a" role="radio" aria-checked="true" tabindex="0">
              <span class="flex items-center justify-center w-6 h-6 rounded-full shrink-0" style="background: var(--ln-color-primary);">
                <span class="w-2 h-2 rounded-full" style="background: var(--ln-color-text-on-primary);"></span>
              </span>
              <span class="text-sm leading-relaxed" style="color: var(--ln-color-text);">沉浸在创作中，画画或写作时</span>
            </button>

            <!-- Option B -->
            <button class="flex items-center gap-3 p-4 rounded-xl border text-left transition-colors duration-150" style="border-color: var(--ln-color-border); background: var(--ln-color-surface);" data-dom-id="option-b" role="radio" aria-checked="false" tabindex="0">
              <span class="flex items-center justify-center w-6 h-6 rounded-full border-2 shrink-0" style="border-color: var(--ln-color-border);">
              </span>
              <span class="text-sm leading-relaxed" style="color: var(--ln-color-text);">和志同道合的朋友深度交流</span>
            </button>

            <!-- Option C -->
            <button class="flex items-center gap-3 p-4 rounded-xl border text-left transition-colors duration-150" style="border-color: var(--ln-color-border); background: var(--ln-color-surface);" data-dom-id="option-c" role="radio" aria-checked="false" tabindex="0">
              <span class="flex items-center justify-center w-6 h-6 rounded-full border-2 shrink-0" style="border-color: var(--ln-color-border);">
              </span>
              <span class="text-sm leading-relaxed" style="color: var(--ln-color-text);">解决一个复杂的技术难题</span>
            </button>

            <!-- Option D -->
            <button class="flex items-center gap-3 p-4 rounded-xl border text-left transition-colors duration-150" style="border-color: var(--ln-color-border); background: var(--ln-color-surface);" data-dom-id="option-d" role="radio" aria-checked="false" tabindex="0">
              <span class="flex items-center justify-center w-6 h-6 rounded-full border-2 shrink-0" style="border-color: var(--ln-color-border);">
              </span>
              <span class="text-sm leading-relaxed" style="color: var(--ln-color-text);">在大自然中散步或旅行</span>
            </button>

          </div>

          <!-- Navigation Buttons -->
          <div class="flex items-center justify-between mt-6 pt-4" style="border-top: 1px solid var(--ln-color-border-light);">
            <button class="inline-flex items-center justify-center px-5 py-2.5 rounded-full text-sm font-medium transition-colors duration-150" style="background: transparent; color: var(--ln-color-text-tertiary);" data-dom-id="btn-prev" disabled aria-disabled="true">
              上一题
            </button>
            <button class="inline-flex items-center justify-center px-6 py-2.5 rounded-full text-sm font-semibold transition-all duration-150" style="background: var(--ln-color-primary); color: var(--ln-color-text-on-primary);" data-dom-id="btn-next">
              下一题
            </button>
          </div>

        </div>
      </section>

      <!-- Spacer for Bottom Tab Bar -->
      <div class="h-20"></div>

    </main>

    <!-- Bottom Tab Bar -->
    <nav class="fixed bottom-0 inset-x-0 z-30 border-t" style="background: var(--ln-color-surface); border-color: var(--ln-color-border);" aria-label="主导航">
      <div class="flex items-center justify-around h-16 max-w-md mx-auto px-2" style="padding-bottom: env(safe-area-inset-bottom, 0px);">

        <a href="home.html" class="flex flex-col items-center gap-0.5 min-w-0" data-dom-id="tab-home" style="color: var(--ln-color-text-tertiary);">
          <span class="text-lg leading-none">&#x1F3E0;</span>
          <span class="text-xs" style="color: var(--ln-color-text-tertiary);">首页</span>
        </a>

        <a href="seed.html" class="flex flex-col items-center gap-0.5 min-w-0" data-dom-id="tab-seed" aria-current="page" style="color: var(--ln-color-primary);">
          <span class="text-lg leading-none">&#x1F331;</span>
          <span class="text-xs font-medium" style="color: var(--ln-color-primary);">种子</span>
        </a>

        <a href="dna.html" class="flex flex-col items-center gap-0.5 min-w-0" data-dom-id="tab-dna" style="color: var(--ln-color-text-tertiary);">
          <span class="text-lg leading-none">&#x1F9EC;</span>
          <span class="text-xs" style="color: var(--ln-color-text-tertiary);">DNA</span>
        </a>

        <a href="report.html" class="flex flex-col items-center gap-0.5 min-w-0" data-dom-id="tab-report" style="color: var(--ln-color-text-tertiary);">
          <span class="text-lg leading-none">&#x1F4CA;</span>
          <span class="text-xs" style="color: var(--ln-color-text-tertiary);">报告</span>
        </a>

      </div>
    </nav>
    <script>lucide.createIcons();</script>
</body>
</html>

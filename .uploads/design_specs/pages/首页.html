<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生命导航</title>
    <style id="theme-vars">
/* ===== Life Navigator — Warm Healing Design System ===== */
/* Brand prefix: ln */

:root {
  /* ── Primary: Warm Amber/Gold ── */
  --ln-color-primary: #C8860E;
  --ln-color-primary-light: #E5A830;
  --ln-color-primary-lighter: #F5DFA0;
  --ln-color-primary-lightest: #FFF8EB;
  --ln-color-primary-dark: #A06C08;
  --ln-color-primary-darker: #7A5206;

  /* ── Neutral Palette ── */
  --ln-color-bg: #FFFBF5;
  --ln-color-bg-warm: #FFF6E9;
  --ln-color-surface: #FFFFFF;
  --ln-color-surface-elevated: #FFFFFF;
  --ln-color-surface-muted: #F9F3EA;
  --ln-color-border: #E8DFD0;
  --ln-color-border-light: #F0E9DD;

  /* ── Text ── */
  --ln-color-text: #2D2A24;
  --ln-color-text-secondary: #6B6456;
  --ln-color-text-tertiary: #9E9586;
  --ln-color-text-inverse: #FFFFFF;
  --ln-color-text-on-primary: #FFFFFF;

  /* ── State Colors ── */
  --state-success: #3D8B5E;
  --state-warning: #D4952B;
  --state-error: #C45A4D;
  --state-info: #5B7FA5;

  /* ── Typography ── */
  --ln-font-display: 'Noto Serif SC', 'Georgia', serif;
  --ln-font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --ln-font-size-xs: 0.75rem;
  --ln-font-size-sm: 0.875rem;
  --ln-font-size-base: 1rem;
  --ln-font-size-lg: 1.125rem;
  --ln-font-size-xl: 1.25rem;
  --ln-font-size-2xl: 1.5rem;
  --ln-font-size-3xl: 1.875rem;
  --ln-font-size-4xl: 2.25rem;

  --ln-font-weight-normal: 400;
  --ln-font-weight-medium: 500;
  --ln-font-weight-semibold: 600;
  --ln-font-weight-bold: 700;

  --ln-line-height-tight: 1.3;
  --ln-line-height-normal: 1.6;
  --ln-line-height-relaxed: 1.8;

  /* ── Spacing ── */
  --ln-space-xs: 4px;
  --ln-space-sm: 8px;
  --ln-space-md: 16px;
  --ln-space-lg: 24px;
  --ln-space-xl: 32px;
  --ln-space-2xl: 48px;
  --ln-space-3xl: 64px;

  /* ── Shape ── */
  --ln-radius-sm: 6px;
  --ln-radius-md: 10px;
  --ln-radius-lg: 14px;
  --ln-radius-xl: 16px;
  --ln-radius-full: 9999px;

  /* ── Surface & Depth ── */
  --ln-shadow-sm: 0 1px 3px rgba(45, 42, 36, 0.04);
  --ln-shadow-md: 0 2px 8px rgba(45, 42, 36, 0.05);
  --ln-shadow-lg: 0 8px 24px rgba(45, 42, 36, 0.05);
  --ln-shadow-float: 0 12px 40px rgba(45, 42, 36, 0.12);

  /* ── Transition ── */
  --ln-transition-fast: 150ms ease;
  --ln-transition-normal: 250ms ease;
  --ln-transition-slow: 400ms ease;
}

/* ── Typography Classes ── */
.ln-h1 {
  font-family: var(--ln-font-display);
  font-size: var(--ln-font-size-4xl);
  font-weight: var(--ln-font-weight-bold);
  line-height: var(--ln-line-height-tight);
  color: var(--ln-color-text);
}

.ln-h2 {
  font-family: var(--ln-font-display);
  font-size: var(--ln-font-size-3xl);
  font-weight: var(--ln-font-weight-bold);
  line-height: var(--ln-line-height-tight);
  color: var(--ln-color-text);
}

.ln-h3 {
  font-family: var(--ln-font-display);
  font-size: var(--ln-font-size-2xl);
  font-weight: var(--ln-font-weight-semibold);
  line-height: var(--ln-line-height-normal);
  color: var(--ln-color-text);
}

.ln-h4 {
  font-family: var(--ln-font-body);
  font-size: var(--ln-font-size-xl);
  font-weight: var(--ln-font-weight-semibold);
  line-height: var(--ln-line-height-normal);
  color: var(--ln-color-text);
}

.ln-body {
  font-family: var(--ln-font-body);
  font-size: var(--ln-font-size-base);
  font-weight: var(--ln-font-weight-normal);
  line-height: var(--ln-line-height-relaxed);
  color: var(--ln-color-text-secondary);
}

.ln-caption {
  font-family: var(--ln-font-body);
  font-size: var(--ln-font-size-sm);
  font-weight: var(--ln-font-weight-normal);
  line-height: var(--ln-line-height-normal);
  color: var(--ln-color-text-tertiary);
}

.ln-label {
  font-family: var(--ln-font-body);
  font-size: var(--ln-font-size-xs);
  font-weight: var(--ln-font-weight-medium);
  line-height: var(--ln-line-height-normal);
  color: var(--ln-color-text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--ln-color-primary);
    --color-primary-light: var(--ln-color-primary-light);
    --color-primary-lighter: var(--ln-color-primary-lighter);
    --color-primary-lightest: var(--ln-color-primary-lightest);
    --color-primary-dark: var(--ln-color-primary-dark);
    --color-surface: var(--ln-color-surface);
    --color-border: var(--ln-color-border);
    --color-border-light: var(--ln-color-border-light);
    --color-bg: var(--ln-color-bg);
    --color-bg-warm: var(--ln-color-bg-warm);
    --color-surface-muted: var(--ln-color-surface-muted);
    --color-text: var(--ln-color-text);
    --color-text-secondary: var(--ln-color-text-secondary);
    --color-text-tertiary: var(--ln-color-text-tertiary);
    --color-text-inverse: var(--ln-color-text-inverse);
    --color-text-on-primary: var(--ln-color-text-on-primary);
    --radius-sm: var(--ln-radius-sm);
    --radius-md: var(--ln-radius-md);
    --radius-lg: var(--ln-radius-lg);
    --radius-xl: var(--ln-radius-xl);
  }
  @layer base {
    body { background: var(--ln-color-bg); color: var(--ln-color-text); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="pb-24">
      <!-- Header Area -->
      <section class="px-6 pt-10 pb-2">
        <div class="flex items-center gap-2 mb-1">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background-color: var(--ln-color-primary);">
            <i data-lucide="compass" class="w-4 h-4" style="color: var(--ln-color-text-on-primary);"></i>
          </div>
          <h1 class="ln-h2" style="font-size: var(--ln-font-size-2xl); text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">生命导航</h1>
        </div>
        <p class="ln-body" style="font-size: var(--ln-font-size-lg); color: var(--ln-color-text);">你好，探索者</p>
        <p class="ln-caption" style="margin-top: var(--ln-space-xs);">每一次探索，都是认识自己的旅程</p>
      </section>

      <!-- Progress Card -->
      <section class="px-6 mt-4">
        <div class="rounded-xl p-5" style="background-color: var(--ln-color-surface); border: 1px solid var(--ln-color-border);">
          <div class="flex items-center justify-between mb-3">
            <p class="ln-h4" style="font-size: var(--ln-font-size-base);">探索旅程</p>
            <span class="ln-caption" style="color: var(--ln-color-text-secondary);">2/7 阶段完成</span>
          </div>
          <div class="w-full h-2 rounded-full overflow-hidden" style="background-color: var(--ln-color-surface-muted);">
            <div class="h-full rounded-full" style="width: 28.5%; background-color: var(--ln-color-primary); transition: width var(--ln-transition-normal);"></div>
          </div>
          <p class="ln-caption" style="margin-top: var(--ln-space-sm);">继续前进，发现更多可能</p>
        </div>
      </section>

      <!-- Daily Wisdom Card -->
      <section class="px-6 mt-4">
        <div class="rounded-xl p-5 relative overflow-hidden" style="background: linear-gradient(135deg, var(--ln-color-bg-warm) 0%, var(--ln-color-primary-lightest) 100%); border: 1px solid var(--ln-color-border-light);">
          <div class="flex items-start justify-between">
            <div class="flex-1 min-w-0">
              <p class="ln-caption" style="margin-bottom: var(--ln-space-sm);">每日智慧</p>
              <p class="ln-h3" style="font-size: var(--ln-font-size-xl); line-height: 1.5; text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">认识你自己</p>
              <p class="ln-caption" style="margin-top: var(--ln-space-xs);">—— 苏格拉底</p>
            </div>
            <button data-dom-id="bookmark-quote" class="shrink-0 ml-3 w-9 h-9 rounded-lg flex items-center justify-center" style="background-color: var(--ln-color-surface); border: 1px solid var(--ln-color-border-light);" aria-label="收藏">
              <i data-lucide="bookmark" class="w-4 h-4" style="color: var(--ln-color-text-tertiary);"></i>
            </button>
          </div>
        </div>
      </section>

      <!-- Module Grid -->
      <section class="px-6 mt-6">
        <h2 class="ln-h4 mb-4" style="font-size: var(--ln-font-size-lg);">探索模块</h2>
        <div class="grid grid-cols-2 gap-3">
          <!-- Module 1: 种子发现 -->
          <button data-dom-id="module-seed" class="rounded-xl p-4 text-left flex flex-col gap-2" style="background-color: var(--ln-color-surface); border: 1px solid var(--ln-color-border); transition: transform var(--ln-transition-fast), box-shadow var(--ln-transition-fast);" onmouseenter="this.style.transform='translateY(-2px)'" onmouseleave="this.style.transform='translateY(0)'">
            <span class="text-2xl" role="img" aria-hidden="true">🌱</span>
            <div>
              <p class="ln-h4" style="font-size: var(--ln-font-size-sm);">种子发现</p>
              <p class="ln-caption" style="font-size: var(--ln-font-size-xs); margin-top: 2px;">热情天赋价值</p>
            </div>
          </button>

          <!-- Module 2: 价值观 -->
          <button data-dom-id="module-values" class="rounded-xl p-4 text-left flex flex-col gap-2" style="background-color: var(--ln-color-surface); border: 1px solid var(--ln-color-border); transition: transform var(--ln-transition-fast), box-shadow var(--ln-transition-fast);" onmouseenter="this.style.transform='translateY(-2px)'" onmouseleave="this.style.transform='translateY(0)'">
            <span class="text-2xl" role="img" aria-hidden="true">💎</span>
            <div>
              <p class="ln-h4" style="font-size: var(--ln-font-size-sm);">价值观</p>
              <p class="ln-caption" style="font-size: var(--ln-font-size-xs); margin-top: 2px;">发现核心价值</p>
            </div>
          </button>

          <!-- Module 3: 生命旅程 -->
          <button class="rounded-xl p-4 text-left flex flex-col gap-2" style="background-color: var(--ln-color-surface); border: 1px solid var(--ln-color-border); transition: transform var(--ln-transition-fast), box-shadow var(--ln-transition-fast);" onmouseenter="this.style.transform='translateY(-2px)'" onmouseleave="this.style.transform='translateY(0)'">
            <span class="text-2xl" role="img" aria-hidden="true">🌈</span>
            <div>
              <p class="ln-h4" style="font-size: var(--ln-font-size-sm);">生命旅程</p>
              <p class="ln-caption" style="font-size: var(--ln-font-size-xs); margin-top: 2px;">人生回顾</p>
            </div>
          </button>

          <!-- Module 4: 角色探索 -->
          <button class="rounded-xl p-4 text-left flex flex-col gap-2" style="background-color: var(--ln-color-surface); border: 1px solid var(--ln-color-border); transition: transform var(--ln-transition-fast), box-shadow var(--ln-transition-fast);" onmouseenter="this.style.transform='translateY(-2px)'" onmouseleave="this.style.transform='translateY(0)'">
            <span class="text-2xl" role="img" aria-hidden="true">🧩</span>
            <div>
              <p class="ln-h4" style="font-size: var(--ln-font-size-sm);">角色探索</p>
              <p class="ln-caption" style="font-size: var(--ln-font-size-xs); margin-top: 2px;">求真尚美向善</p>
            </div>
          </button>

          <!-- Module 5: 愿景冥想 -->
          <button class="rounded-xl p-4 text-left flex flex-col gap-2" style="background-color: var(--ln-color-surface); border: 1px solid var(--ln-color-border); transition: transform var(--ln-transition-fast), box-shadow var(--ln-transition-fast);" onmouseenter="this.style.transform='translateY(-2px)'" onmouseleave="this.style.transform='translateY(0)'">
            <span class="text-2xl" role="img" aria-hidden="true">🎬</span>
            <div>
              <p class="ln-h4" style="font-size: var(--ln-font-size-sm);">愿景冥想</p>
              <p class="ln-caption" style="font-size: var(--ln-font-size-xs); margin-top: 2px;">理想终局</p>
            </div>
          </button>

          <!-- Module 6: 生命平衡 -->
          <button data-dom-id="module-balance" class="rounded-xl p-4 text-left flex flex-col gap-2" style="background-color: var(--ln-color-surface); border: 1px solid var(--ln-color-border); transition: transform var(--ln-transition-fast), box-shadow var(--ln-transition-fast);" onmouseenter="this.style.transform='translateY(-2px)'" onmouseleave="this.style.transform='translateY(0)'">
            <span class="text-2xl" role="img" aria-hidden="true">⚖️</span>
            <div>
              <p class="ln-h4" style="font-size: var(--ln-font-size-sm);">生命平衡</p>
              <p class="ln-caption" style="font-size: var(--ln-font-size-xs); margin-top: 2px;">七维评估</p>
            </div>
          </button>

          <!-- Module 7: 人生DNA -->
          <button class="rounded-xl p-4 text-left flex flex-col gap-2" style="background-color: var(--ln-color-surface); border: 1px solid var(--ln-color-border); transition: transform var(--ln-transition-fast), box-shadow var(--ln-transition-fast);" onmouseenter="this.style.transform='translateY(-2px)'" onmouseleave="this.style.transform='translateY(0)'">
            <span class="text-2xl" role="img" aria-hidden="true">🧬</span>
            <div>
              <p class="ln-h4" style="font-size: var(--ln-font-size-sm);">人生DNA</p>
              <p class="ln-caption" style="font-size: var(--ln-font-size-xs); margin-top: 2px;">使命愿景价值</p>
            </div>
          </button>

          <!-- Module 8: 我的报告 -->
          <button data-dom-id="module-report" class="rounded-xl p-4 text-left flex flex-col gap-2" style="background-color: var(--ln-color-surface); border: 1px solid var(--ln-color-border); transition: transform var(--ln-transition-fast), box-shadow var(--ln-transition-fast);" onmouseenter="this.style.transform='translateY(-2px)'" onmouseleave="this.style.transform='translateY(0)'">
            <span class="text-2xl" role="img" aria-hidden="true">📊</span>
            <div>
              <p class="ln-h4" style="font-size: var(--ln-font-size-sm);">我的报告</p>
              <p class="ln-caption" style="font-size: var(--ln-font-size-xs); margin-top: 2px;">查看生成</p>
            </div>
          </button>
        </div>
      </section>

      <!-- Primary CTA -->
      <section class="px-6 mt-6">
        <button data-dom-id="cta-explore" class="w-full py-3.5 rounded-full text-center font-semibold text-base" style="background-color: var(--ln-color-primary); color: var(--ln-color-text-on-primary); font-family: var(--ln-font-body); transition: background-color var(--ln-transition-fast), transform var(--ln-transition-fast);" onmouseenter="this.style.backgroundColor='var(--ln-color-primary-dark)';this.style.transform='translateY(-1px)'" onmouseleave="this.style.backgroundColor='var(--ln-color-primary)';this.style.transform='translateY(0)'" onmousedown="this.style.transform='translateY(0) scale(0.99)'" onmouseup="this.style.transform='translateY(-1px)'">
          开启完整探索之旅
        </button>
      </section>

      <!-- Bottom Tab Bar -->
      <nav class="fixed bottom-0 left-0 right-0 z-30 border-t" style="border-color: var(--ln-color-border); background-color: var(--ln-color-surface);" aria-label="主导航">
        <div class="flex items-center justify-around h-16">
          <button data-dom-id="tab-home" class="flex flex-col items-center gap-0.5 px-3 py-1" style="color: var(--ln-color-primary);" aria-label="首页" aria-current="page">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-xs" style="font-family: var(--ln-font-body); font-weight: var(--ln-font-weight-medium);">首页</span>
          </button>
          <button data-dom-id="tab-seed" class="flex flex-col items-center gap-0.5 px-3 py-1" style="color: var(--ln-color-text-tertiary);" aria-label="种子">
            <i data-lucide="sprout" class="w-5 h-5"></i>
            <span class="text-xs" style="font-family: var(--ln-font-body);">种子</span>
          </button>
          <button data-dom-id="tab-dna" class="flex flex-col items-center gap-0.5 px-3 py-1" style="color: var(--ln-color-text-tertiary);" aria-label="DNA">
            <i data-lucide="dna" class="w-5 h-5"></i>
            <span class="text-xs" style="font-family: var(--ln-font-body);">DNA</span>
          </button>
          <button data-dom-id="tab-report" class="flex flex-col items-center gap-0.5 px-3 py-1" style="color: var(--ln-color-text-tertiary);" aria-label="报告">
            <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
            <span class="text-xs" style="font-family: var(--ln-font-body);">报告</span>
          </button>
        </div>
        <!-- Safe area bottom for devices with home indicator -->
        <div style="height: env(safe-area-inset-bottom, 0px);"></div>
      </nav>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>

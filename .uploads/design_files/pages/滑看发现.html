  --shadow-xl:            0 20px 60px rgba(45,42,38,0.15), 0 8px 24px rgba(196,149,106,0.1);
  --shadow-gold:          0 4px 20px rgba(212,160,60,0.25);

  --shadow-inner:         inset 0 1px 2px rgba(45,42,38,0.04), inset 0 0 0 1px rgba(255,255,255,0.8);

  /* ── motion ── */

  /* ── gradient ── */

  --gradient-gold:           linear-gradient(135deg, #F0C850 0%, #D4A03C 50%, #B8860B 100%);
  --gradient-rose:           linear-gradient(135deg, #FFD1DC 0%, #E8A0B8 100%);

  --gradient-card:           linear-gradient(180deg, #FFFFFF 0%, #FFFAF5 100%);
  --gradient-success:        linear-gradient(135deg, #8FBC8F 0%, #6B9E6B 100%);

  --gradient-danger:         linear-gradient(135deg, #E88585 0%, #C45C5C 100%);

  /* ── portable aliases ── */
  --color-page-bg:           var(--color-bg);

  --color-on-surface-secondary: var(--color-text-secondary);
  --color-on-surface-muted:  var(--color-text-muted);
  --color-brand:             var(--color-primary);
  --color-brand-light:       var(--color-primary-light);
  --color-brand-lighter:     var(--color-primary-lighter);
  --color-brand-lightest:    var(--color-primary-lightest);
  --color-brand-dark:        var(--color-primary-dark);
  --color-brand-darker:      var(--color-primary-darker);
  --color-brand-accent:      var(--color-accent);
  --color-divider:           var(--color-border);
  --color-divider-light:     var(--color-border-light);
  --color-divider-lighter:   var(--color-border-lighter);
  --radius-button:           var(--radius-sm);
  --radius-card:             var(--radius-lg);
  --radius-card-sm:          var(--radius-md);
  --shadow-card:             var(--shadow-sm);
  --type-xs:                 var(--font-xs);
  --type-sm:                 var(--font-sm);
  --type-base:               var(--font-base);
  --type-md:                 var(--font-md);
  --type-lg:                 var(--font-lg);
  --type-xl:                 var(--font-xl);
  --type-2xl:                var(--font-2xl);
}

/* ── Button ────────────────────────────────────────────────── */
/* @anatomy
   <div class="page"> <h1 class="page-title">Button</h1> <!-- 1. Primary --> <div class="section"> <div class="section-label">Primary</div>
*/
.page {
      width: 100%;
      max-width: 430px;
    }

    .page-title {
      font-size: var(--font-2xl);
      font-weight: var(--font-weight-heading);
      margin-bottom: var(--space-16);
      color: var(--color-text);
    }

    .section {
      margin-bottom: var(--space-16);
    }

    .section-label {
      font-size: var(--font-xs);
      font-weight: var(--font-weight-heading);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: var(--space-12);
    }

    .section-buttons {
      display: flex;
      flex-direction: column;
      gap: var(--space-8);
    }

    .section-buttons--row {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-8);
    }

    /* ── Base button ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      outline: none;
      cursor: pointer;
      font-family: var(--font-family);
      font-weight: 600;
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
      text-decoration: none;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      opacity: 0.8;
      transform: scale(0.98);
    }

    /* ── Primary ── */
    .btn-primary {
      background: var(--gradient-primary);
      color: white;
      padding: 12px 24px;
      font-size: var(--font-base);
      box-shadow: var(--shadow-primary);
    }

    /* ── Secondary ── */
    .btn-secondary {
      background: var(--color-bg-alt);
      color: var(--color-text);
      padding: 12px 24px;
      font-size: var(--font-base);
    }

    /* ── Outline ── */
    .btn-outline {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
      padding: 12px 24px;
      font-size: var(--font-base);
    }

    /* ── Danger ── */
    .btn-danger {
      background: var(--color-danger);
      color: white;
      padding: 12px 24px;
      font-size: var(--font-base);
    }

    /* ── Size: sm ── */
    .btn-sm {
      font-size: var(--font-sm);
      padding: 8px 16px;
    }

    /* ── Size: md (default) ── */
    .btn-md {
      font-size: var(--font-base);
      padding: 12px 24px;
    }

    /* ── Size: lg ── */
    .btn-lg {
      font-size: var(--font-lg);
      padding: 16px 32px;
      width: 100%;
    }

    /* ── Disabled ── */
    .btn:disabled,
    .btn-disabled {
      opacity: 0.5;
      pointer-events: none;
    }

/* ── Card ──────────────────────────────────────────────────── */
/* @anatomy
   <div class="page-shell"> <!-- Page Header --> <h1 class="page-title">Card</h1> <p class="page-subtitle">MakeupPal Design System &mdash; Component Preview</p> <!-- ── 1. Makeup Thumbnail Card ── --> <div class="section"> <div class="section-label">1. Makeup Thumbnail Card (Default)</div>
*/
/* ── Page reset & layout ── */


    .page-shell {
      max-width: 430px;
      margin: 0 auto;
      padding: var(--space-16) var(--space-16) 48px;
    }

    /* ── Page header ── */
    .page-title {
      font-size: var(--font-2xl);
      font-weight: var(--font-weight-heading);
      color: var(--color-text);
      margin-bottom: var(--space-8);
    }

    .page-subtitle {
      font-size: var(--font-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-16);
    }

    /* ── Section labels ── */
    .section {
      margin-bottom: var(--space-16);
    }

    .section-label {
      font-size: var(--font-xs);
      font-weight: var(--font-weight-heading);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-12);
    }

    /* ── Shared card base ── */
    .card-base {
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    /* ── 1. Makeup Thumbnail Card (default) ── */
    .card-makeup {
      box-shadow: var(--shadow-sm);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: box-shadow var(--transition-base), transform var(--transition-base);
    }

    .card-makeup:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .card-makeup__image {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: var(--gradient-soft);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card-makeup__image-placeholder {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      background: var(--color-primary-lighter);
      opacity: 0.6;
    }

    .card-makeup__image-badge {
      position: absolute;
      top: var(--space-12);
      right: var(--space-12);
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-makeup__image-badge svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--color-text-muted);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card-makeup__content {
      padding: var(--space-12) var(--space-16) var(--space-16);
    }

    .card-makeup__title {
      font-size: var(--font-base);
      font-weight: var(--font-weight-heading);
      color: var(--color-text);
      margin-bottom: var(--space-8);
      line-height: 1.4;
    }

    .card-makeup__tags {
      display: flex;
      gap: var(--space-8);
      margin-bottom: var(--space-8);
    }

    .card-makeup__tag {
      display: inline-flex;
      align-items: center;
      padding: 3px var(--space-8);
      font-size: var(--font-xs);
      font-weight: var(--font-weight-body);
      color: var(--color-text-secondary);
      background: var(--color-bg-alt);
      border-radius: var(--radius-full);
      line-height: 1.4;
    }

    .card-makeup__stats {
      display: flex;
      align-items: center;
      gap: var(--space-12);
      font-size: var(--font-xs);
      color: var(--color-text-muted);
    }

    .card-makeup__stat {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .card-makeup__stat svg {
      width: 12px;
      height: 12px;
    }

    .card-makeup__stat--star svg {
      fill: var(--color-gold);
      stroke: var(--color-gold);
    }

    .card-makeup__stat--eye svg {
      fill: none;
      stroke: var(--color-text-muted);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── 2. Step Card ── */
    .card-step {
      display: flex;
      align-items: center;
      gap: var(--space-12);
      background: var(--color-bg-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-xs);
      padding: var(--space-12);
      cursor: pointer;
      transition: box-shadow var(--transition-base);
    }

    .card-step:hover {
      box-shadow: var(--shadow-sm);
    }

    .card-step__number {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-sm);
      font-weight: var(--font-weight-heading);
    }

    .card-step__body {
      flex: 1;
      min-width: 0;
    }

    .card-step__title {
      font-size: var(--font-base);
      font-weight: var(--font-weight-heading);
      color: var(--color-text);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-step__duration {
      font-size: var(--font-xs);
      color: var(--color-text-muted);
    }

    .card-step__thumb {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: var(--radius-sm);
      background: var(--gradient-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-step__thumb-placeholder {
      width: 20px;
      height: 20px;
      border-radius: var(--radius-full);
      background: var(--color-primary-lighter);
      opacity: 0.5;
    }

    /* ── 3. Profile Card ── */
    .card-profile {
      display: flex;
      align-items: center;
      gap: var(--space-12);
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--space-16);
      cursor: pointer;
      transition: box-shadow var(--transition-base);
    }

    .card-profile:hover {
      box-shadow: var(--shadow-md);
    }

    .card-profile__avatar {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-profile__avatar svg {
      width: 24px;
      height: 24px;
      fill: #fff;
      opacity: 0.85;
    }

    .card-profile__info {
      flex: 1;
      min-width: 0;
    }

    .card-profile__name {
      font-size: var(--font-md);
      font-weight: var(--font-weight-heading);
      color: var(--color-text);
      margin-bottom: 2px;
    }

    .card-profile__desc {
      font-size: var(--font-xs);
      color: var(--color-text-muted);
    }

    .card-profile__action {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-profile__action svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: var(--color-text-muted);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── 4. Resume Card ── */
    .card-resume {
      display: flex;
      align-items: center;
      gap: var(--space-12);
      background: var(--color-bg-alt);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--space-12) var(--space-16);
      cursor: pointer;
      transition: box-shadow var(--transition-base);
    }

    .card-resume:hover {
      box-shadow: var(--shadow-md);
    }

    .card-resume__thumb {
      flex-shrink: 0;
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      background: var(--gradient-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-resume__thumb-placeholder {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-full);
      background: var(--color-primary-lighter);
      opacity: 0.5;
    }

    .card-resume__body {
      flex: 1;
      min-width: 0;
    }

    .card-resume__title {
      font-size: var(--font-base);
      font-weight: var(--font-weight-heading);
      color: var(--color-text);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-resume__progress {
      font-size: var(--font-xs);
      color: var(--color-text-muted);
    }

    .card-resume__progress span {
      color: var(--color-primary);
      font-weight: var(--font-weight-heading);
    }

    .card-resume__btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-16);
      font-size: var(--font-sm);
      font-weight: var(--font-weight-heading);
      color: #fff;
      background: var(--color-primary);
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .card-resume__btn:hover {
      background: var(--color-primary-dark);
    }

    /* ── 5. Empty State Card ── */
    .card-empty {
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 40px var(--space-16) var(--space-16);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .card-empty__icon {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-full);
      background: var(--color-bg-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-16);
    }

    .card-empty__icon svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: var(--color-text-muted);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.6;
    }

    .card-empty__title {
      font-size: var(--font-md);
      font-weight: var(--font-weight-heading);
      color: var(--color-text);
      margin-bottom: var(--space-8);
    }

    .card-empty__desc {
      font-size: var(--font-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-16);

      .text-muted { color: var(--color-muted); }
      .border-muted { border-color: var(--color-muted); }
      .ring-muted { --tw-ring-color: var(--color-muted); }
      .bg-accent { background-color: var(--color-accent); }
      .text-accent { color: var(--color-accent); }
      .border-accent { border-color: var(--color-accent); }
      .ring-accent { --tw-ring-color: var(--color-accent); }
      .bg-border { background-color: var(--color-border); }
      .text-border { color: var(--color-border); }
      .border-border { border-color: var(--color-border); }
      .ring-border { --tw-ring-color: var(--color-border); }
      .bg-background { background-color: var(--color-bg); }
      .text-background { color: var(--color-bg); }
      .border-background { border-color: var(--color-bg); }
      .ring-background { --tw-ring-color: var(--color-bg); }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <!-- Full-screen swipe discover experience -->
      <div class="relative w-full flex flex-col" style="min-height: 100vh; min-height: 100dvh; background: var(--color-bg);">

        <!-- Status bar spacer -->
        <div class="h-11 flex-shrink-0" aria-hidden="true"></div>

        <!-- Top Nav Bar (overlay on cards) -->

          <!-- Back arrow -->
          <button data-dom-id="btn-back" class="w-9 h-9 flex items-center justify-center rounded-lg" style="-webkit-tap-highlight-color: transparent;" aria-label="返回">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>
          <!-- Center title -->
          <h1 class="text-[var(--font-lg)] font-semibold text-white" style="text-shadow: 0 1px 4px color-mix(in srgb, var(--color-text) 30%, transparent);">发现</h1>

            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/>
              <path d="m22.54 12.43-1.91 4.02a1 1 0 0 1-.83.55H4.2a1 1 0 0 1-.83-.55L1.46 12.43"/>
              <path d="m22.54 16.43-1.91 4.02a1 1 0 0 1-.83.55H4.2a1 1 0 0 1-.83-.55L1.46 16.43"/>
            </svg>
          </button>
        </header>

        <!-- Card Stack Area -->
        <div class="flex-1 relative overflow-hidden flex items-center justify-center">

          <!-- Card 3 (BACK — scale 0.9, translateY 20px, z-index 10) -->
          <div class="absolute w-full left-1/2 overflow-hidden" style="transform: translateX(-50%) scale(0.9) translateY(20px); max-width: 355px; height: 480px; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); z-index: 10; background: var(--gradient-soft); transition: transform 0.3s ease;">
            <!-- Only top portion visible, minimal overlay -->
            <div class="absolute bottom-0 left-0 right-0 p-5" style="background: linear-gradient(to top, color-mix(in srgb, var(--color-text) 30%, transparent), transparent 70%);">
              <h3 class="text-[var(--font-xl)] font-semibold text-white truncate">韩式白开水妆</h3>
            </div>
          </div>

          <!-- Card 2 (BEHIND — scale 0.95, translateY 10px, z-index 20) -->
          <div class="absolute w-full left-1/2 overflow-hidden" style="transform: translateX(-50%) scale(0.95) translateY(10px); max-width: 355px; height: 480px; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); z-index: 20; background: var(--gradient-gold); transition: transform 0.3s ease;">
            <!-- Bottom overlay content -->
            <div class="absolute bottom-0 left-0 right-0 p-5" style="background: linear-gradient(to top, color-mix(in srgb, var(--color-text) 40%, transparent), transparent 65%);">
              <h3 class="text-[var(--font-xl)] font-semibold text-white truncate mb-2">日系元气桃花妆</h3>
              <div class="flex gap-2">
                <span class="whitespace-nowrap inline-flex items-center px-2.5 py-0.5 text-[var(--font-xs)] rounded-full" style="background: rgba(255,255,255,0.25); color: white; line-height: 1.4;">日常</span>
                <span class="whitespace-nowrap inline-flex items-center px-2.5 py-0.5 text-[var(--font-xs)] rounded-full" style="background: rgba(255,255,255,0.25); color: white; line-height: 1.4;">淡颜系</span>
                <span class="whitespace-nowrap inline-flex items-center px-2.5 py-0.5 text-[var(--font-xs)] rounded-full" style="background: rgba(255,255,255,0.25); color: white; line-height: 1.4;">15分钟</span>
              </div>
            </div>
          </div>

          <!-- Card 1 (FRONT — scale 1, z-index 30) -->
          <div class="absolute w-full left-1/2 overflow-hidden" data-dom-id="card-swipe" style="transform: translateX(-50%) scale(1); max-width: 355px; height: 480px; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); z-index: 30; background: var(--gradient-rose); transition: transform 0.3s ease;">

            <!-- Swipe indicator left (hidden by default) -->

              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M15 9l-6 6"/><path d="M9 9l6 6"/>
              </svg>
              <span class="text-[var(--font-base)] font-semibold" style="color: var(--color-danger);">跳过</span>
            </div>

            <!-- Swipe indicator right (hidden by default) -->
            <div class="absolute flex flex-col items-center gap-2 pointer-events-none" style="top: 50%; right: 24px; transform: translateY(-50%) rotate(15deg); opacity: 0; z-index: 35;">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-pink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
              <span class="text-[var(--font-base)] font-semibold" style="color: var(--color-pink);">收藏</span>
            </div>

            <!-- Heart icon top-right corner -->
            <button class="absolute top-4 right-4 z-10 w-8 h-8 flex items-center justify-center" style="-webkit-tap-highlight-color: transparent;" aria-label="收藏">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </button>

            <!-- Bottom overlay area with content -->
            <div class="absolute bottom-0 left-0 right-0 p-5" style="background: linear-gradient(to top, color-mix(in srgb, var(--color-text) 50%, transparent), transparent 65%);">
              <h2 class="text-white text-[var(--font-xl)] font-semibold mb-1">法式慵懒裸妆</h2>
              <p class="text-[var(--font-sm)] text-white mb-3" style="opacity: 0.8;">by 妆妆老师</p>
              <!-- Tags row -->
              <div class="flex gap-2 mb-3">
                <span class="whitespace-nowrap inline-flex items-center px-2.5 py-0.5 text-[var(--font-xs)] rounded-full" style="background: rgba(255,255,255,0.25); color: white; line-height: 1.4;">约会</span>
                <span class="whitespace-nowrap inline-flex items-center px-2.5 py-0.5 text-[var(--font-xs)] rounded-full" style="background: rgba(255,255,255,0.25); color: white; line-height: 1.4;">新手友好</span>
                <span class="whitespace-nowrap inline-flex items-center px-2.5 py-0.5 text-[var(--font-xs)] rounded-full" style="background: rgba(255,255,255,0.25); color: white; line-height: 1.4;">25分钟</span>
              </div>
              <!-- Stats row -->
              <div class="flex items-center gap-3 text-white text-[var(--font-xs)]" style="opacity: 0.9;">
                <span class="flex items-center gap-1">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="var(--color-gold)" stroke="var(--color-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                  </svg>
                  4.9
                </span>
                <span style="opacity: 0.6;">&#183;</span>
                <span>2.3k 收藏</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Long Press Menu (visible for demo) -->
        <div class="flex justify-center flex-shrink-0 relative z-50" style="margin-top: -44px; margin-bottom: 4px;">
          <div class="overflow-hidden" style="width: 280px; background: var(--color-bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
            <!-- Menu item 1: 拆解这个妆 -->
            <button class="w-full flex items-center gap-3" style="padding: 14px 16px; -webkit-tap-highlight-color: transparent;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                <path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
              </svg>
              <span class="text-[var(--font-base)]" style="color: var(--color-text);">拆解这个妆</span>
            </button>
            <div style="height: 1px; background: var(--color-border-lighter); margin-left: 16px;"></div>
            <!-- Menu item 2: 直接跟练 -->
            <button class="w-full flex items-center gap-3" style="padding: 14px 16px; -webkit-tap-highlight-color: transparent;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="6 3 20 12 6 21 6 3"/>
              </svg>
              <span class="text-[var(--font-base)]" style="color: var(--color-text);">直接跟练</span>
            </button>
            <div style="height: 1px; background: var(--color-border-lighter); margin-left: 16px;"></div>
            <!-- Menu item 3: 分享 -->
            <button class="w-full flex items-center gap-3" style="padding: 14px 16px; -webkit-tap-highlight-color: transparent;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
              </svg>
              <span class="text-[var(--font-base)]" style="color: var(--color-text);">分享</span>
            </button>
          </div>
        </div>

        <!-- Bottom Action Bar -->
        <div class="relative z-30 flex items-center justify-center gap-5 flex-shrink-0" style="padding-top: 8px; padding-bottom: 32px;">

          <!-- 1. Undo button (44px) -->
          <button data-dom-id="btn-undo" class="w-11 h-11 rounded-full flex items-center justify-center active:scale-[0.92]" style="background: var(--color-bg-alt); box-shadow: var(--shadow-sm); transition: transform var(--transition-fast); -webkit-tap-highlight-color: transparent;" aria-label="撤销">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
            </svg>
          </button>

          <!-- 2. Skip button (52px) -->
          <button class="w-[52px] h-[52px] rounded-full flex items-center justify-center active:scale-[0.92]" style="background: var(--color-bg-card); box-shadow: var(--shadow-md); transition: transform var(--transition-fast); -webkit-tap-highlight-color: transparent;" aria-label="跳过">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-danger)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
            </svg>
          </button>

          <!-- 3. Heart/Save button (60px, largest) -->
          <button class="w-[60px] h-[60px] rounded-full flex items-center justify-center active:scale-[0.92]" style="background: var(--gradient-primary); box-shadow: var(--shadow-primary); transition: transform var(--transition-fast); -webkit-tap-highlight-color: transparent;" aria-label="收藏">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </button>

          <!-- 4. Share button (52px) -->
          <button class="w-[52px] h-[52px] rounded-full flex items-center justify-center active:scale-[0.92]" style="background: var(--color-bg-card); box-shadow: var(--shadow-md); transition: transform var(--transition-fast); -webkit-tap-highlight-color: transparent;" aria-label="分享">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>

            </svg>
          </button>

          <!-- 5. Info/Detail button (44px) -->
          <button data-dom-id="card-swipe" class="w-11 h-11 rounded-full flex items-center justify-center active:scale-[0.92]" style="background: var(--color-bg-alt); box-shadow: var(--shadow-sm); transition: transform var(--transition-fast); -webkit-tap-highlight-color: transparent;" aria-label="详情">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>

      </div>

    <style type="text/tailwindcss">
  @theme inline {

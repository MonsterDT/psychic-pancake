  --shadow-xl:            0 20px 60px rgba(45,42,38,0.15), 0 8px 24px rgba(196,149,106,0.1);
  --shadow-gold:          0 4px 20px rgba(212,160,60,0.25);

  /* ── motion ── */

  /* ── gradient ── */

  --gradient-gold:           linear-gradient(135deg, #F0C850 0%, #D4A03C 50%, #B8860B 100%);

  --gradient-card:           linear-gradient(180deg, #FFFFFF 0%, #FFFAF5 100%);
  --gradient-success:        linear-gradient(135deg, #8FBC8F 0%, #6B9E6B 100%);

  /* ── portable aliases ── */
  --color-page-bg:           var(--color-bg);

  --color-on-surface-secondary: var(--color-text-secondary);
  --color-on-surface-muted:  var(--color-text-muted);
  --color-brand:             var(--color-primary);
  --color-brand-light:       var(--color-primary-light);
  --color-brand-lighter:     var(--color-primary-lighter);
  --color-brand-lightest:    var(--color-primary-lightest);
  --color-brand-dark:        var(--color-primary-dark);
  --color-brand-darker:      var(--color-primary-darker);
  --color-brand-accent:      var(--color-accent);
  --color-divider:           var(--color-border);
  --color-divider-light:     var(--color-border-light);
  --color-divider-lighter:   var(--color-border-lighter);
  --radius-button:           var(--radius-sm);
  --radius-card:             var(--radius-lg);
  --radius-card-sm:          var(--radius-md);
  --shadow-card:             var(--shadow-sm);
  --type-xs:                 var(--font-xs);
  --type-sm:                 var(--font-sm);
  --type-base:               var(--font-base);
  --type-md:                 var(--font-md);

  --type-xl:                 var(--font-xl);
  --type-2xl:                var(--font-2xl);
}

/* ── Button ────────────────────────────────────────────────── */
/* @anatomy
   <div class="page"> <h1 class="page-title">Button</h1> <!-- 1. Primary --> <div class="section"> <div class="section-label">Primary</div>
*/
.page {
      width: 100%;
      max-width: 430px;
    }

    .page-title {
      font-size: var(--font-2xl);
      font-weight: var(--font-weight-heading);
      margin-bottom: var(--space-16);
      color: var(--color-text);
    }

    .section {
      margin-bottom: var(--space-16);
    }

    .section-label {
      font-size: var(--font-xs);
      font-weight: var(--font-weight-heading);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: var(--space-12);
    }

    .section-buttons {
      display: flex;
      flex-direction: column;
      gap: var(--space-8);
    }

    .section-buttons--row {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-8);
    }

    /* ── Base button ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      outline: none;
      cursor: pointer;
      font-family: var(--font-family);
      font-weight: 600;
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
      text-decoration: none;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      opacity: 0.8;
      transform: scale(0.98);
    }

    /* ── Primary ── */
    .btn-primary {
      background: var(--gradient-primary);
      color: white;
      padding: 12px 24px;
      font-size: var(--font-base);
      box-shadow: var(--shadow-primary);
    }

    /* ── Secondary ── */
    .btn-secondary {
      background: var(--color-bg-alt);
      color: var(--color-text);
      padding: 12px 24px;
      font-size: var(--font-base);
    }

    /* ── Outline ── */
    .btn-outline {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
      padding: 12px 24px;
      font-size: var(--font-base);
    }

    /* ── Danger ── */
    .btn-danger {
      background: var(--color-danger);
      color: white;
      padding: 12px 24px;
      font-size: var(--font-base);
    }

    /* ── Size: sm ── */
    .btn-sm {
      font-size: var(--font-sm);
      padding: 8px 16px;
    }

    /* ── Size: md (default) ── */
    .btn-md {
      font-size: var(--font-base);
      padding: 12px 24px;
    }

    /* ── Size: lg ── */
    .btn-lg {
      font-size: var(--font-lg);
      padding: 16px 32px;
      width: 100%;
    }

    /* ── Disabled ── */
    .btn:disabled,
    .btn-disabled {
      opacity: 0.5;
      pointer-events: none;
    }

/* ── Card ──────────────────────────────────────────────────── */
/* @anatomy
   <div class="page-shell"> <!-- Page Header --> <h1 class="page-title">Card</h1> <p class="page-subtitle">MakeupPal Design System &mdash; Component Preview</p> <!-- ── 1. Makeup Thumbnail Card ── --> <div class="section"> <div class="section-label">1. Makeup Thumbnail Card (Default)</div>
*/
/* ── Page reset & layout ── */


    .page-shell {
      max-width: 430px;
      margin: 0 auto;
      padding: var(--space-16) var(--space-16) 48px;
    }

    /* ── Page header ── */
    .page-title {
      font-size: var(--font-2xl);
      font-weight: var(--font-weight-heading);
      color: var(--color-text);
      margin-bottom: var(--space-8);
    }

    .page-subtitle {
      font-size: var(--font-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-16);
    }

    /* ── Section labels ── */
    .section {
      margin-bottom: var(--space-16);
    }

    .section-label {
      font-size: var(--font-xs);
      font-weight: var(--font-weight-heading);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-12);
    }

    /* ── Shared card base ── */
    .card-base {
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    /* ── 1. Makeup Thumbnail Card (default) ── */
    .card-makeup {
      box-shadow: var(--shadow-sm);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: box-shadow var(--transition-base), transform var(--transition-base);
    }

    .card-makeup:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .card-makeup__image {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: var(--gradient-soft);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card-makeup__image-placeholder {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      background: var(--color-primary-lighter);
      opacity: 0.6;
    }

    .card-makeup__image-badge {
      position: absolute;
      top: var(--space-12);
      right: var(--space-12);
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-makeup__image-badge svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--color-text-muted);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card-makeup__content {
      padding: var(--space-12) var(--space-16) var(--space-16);
    }

    .card-makeup__title {
      font-size: var(--font-base);
      font-weight: var(--font-weight-heading);
      color: var(--color-text);
      margin-bottom: var(--space-8);
      line-height: 1.4;
    }

    .card-makeup__tags {
      display: flex;
      gap: var(--space-8);
      margin-bottom: var(--space-8);
    }

    .card-makeup__tag {
      display: inline-flex;
      align-items: center;
      padding: 3px var(--space-8);
      font-size: var(--font-xs);
      font-weight: var(--font-weight-body);
      color: var(--color-text-secondary);
      background: var(--color-bg-alt);
      border-radius: var(--radius-full);
      line-height: 1.4;
    }

    .card-makeup__stats {
      display: flex;
      align-items: center;
      gap: var(--space-12);
      font-size: var(--font-xs);
      color: var(--color-text-muted);
    }

    .card-makeup__stat {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .card-makeup__stat svg {
      width: 12px;
      height: 12px;
    }

    .card-makeup__stat--star svg {
      fill: var(--color-gold);
      stroke: var(--color-gold);
    }

    .card-makeup__stat--eye svg {
      fill: none;
      stroke: var(--color-text-muted);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── 2. Step Card ── */
    .card-step {
      display: flex;
      align-items: center;
      gap: var(--space-12);
      background: var(--color-bg-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-xs);
      padding: var(--space-12);
      cursor: pointer;
      transition: box-shadow var(--transition-base);
    }

    .card-step:hover {
      box-shadow: var(--shadow-sm);
    }

    .card-step__number {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-sm);
      font-weight: var(--font-weight-heading);
    }

    .card-step__body {
      flex: 1;
      min-width: 0;
    }

    .card-step__title {
      font-size: var(--font-base);
      font-weight: var(--font-weight-heading);
      color: var(--color-text);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-step__duration {
      font-size: var(--font-xs);
      color: var(--color-text-muted);
    }

    .card-step__thumb {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: var(--radius-sm);
      background: var(--gradient-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-step__thumb-placeholder {
      width: 20px;
      height: 20px;
      border-radius: var(--radius-full);
      background: var(--color-primary-lighter);
      opacity: 0.5;
    }

    /* ── 3. Profile Card ── */
    .card-profile {
      display: flex;
      align-items: center;
      gap: var(--space-12);
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--space-16);
      cursor: pointer;
      transition: box-shadow var(--transition-base);
    }

    .card-profile:hover {
      box-shadow: var(--shadow-md);
    }

    .card-profile__avatar {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-full);
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-profile__avatar svg {
      width: 24px;
      height: 24px;
      fill: #fff;
      opacity: 0.85;
    }

    .card-profile__info {
      flex: 1;
      min-width: 0;
    }

    .card-profile__name {
      font-size: var(--font-md);
      font-weight: var(--font-weight-heading);
      color: var(--color-text);
      margin-bottom: 2px;
    }

    .card-profile__desc {
      font-size: var(--font-xs);
      color: var(--color-text-muted);
    }

    .card-profile__action {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-profile__action svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: var(--color-text-muted);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── 4. Resume Card ── */
    .card-resume {
      display: flex;
      align-items: center;
      gap: var(--space-12);
      background: var(--color-bg-alt);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--space-12) var(--space-16);
      cursor: pointer;
      transition: box-shadow var(--transition-base);
    }

    .card-resume:hover {
      box-shadow: var(--shadow-md);
    }

    .card-resume__thumb {
      flex-shrink: 0;
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      background: var(--gradient-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-resume__thumb-placeholder {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-full);
      background: var(--color-primary-lighter);
      opacity: 0.5;
    }

    .card-resume__body {
      flex: 1;
      min-width: 0;
    }

    .card-resume__title {
      font-size: var(--font-base);
      font-weight: var(--font-weight-heading);
      color: var(--color-text);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-resume__progress {
      font-size: var(--font-xs);
      color: var(--color-text-muted);
    }

    .card-resume__progress span {
      color: var(--color-primary);
      font-weight: var(--font-weight-heading);
    }

    .card-resume__btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-16);
      font-size: var(--font-sm);
      font-weight: var(--font-weight-heading);
      color: #fff;
      background: var(--color-primary);
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .card-resume__btn:hover {
      background: var(--color-primary-dark);
    }

    /* ── 5. Empty State Card ── */
    .card-empty {
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 40px var(--space-16) var(--space-16);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .card-empty__icon {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-full);
      background: var(--color-bg-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-16);
    }

    .card-empty__icon svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: var(--color-text-muted);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.6;
    }

    .card-empty__title {
      font-size: var(--font-md);
      font-weight: var(--font-weight-heading);
      color: var(--color-text);
      margin-bottom: var(--space-8);
    }

    .card-empty__desc {
      font-size: var(--font-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-16);

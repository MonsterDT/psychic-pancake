<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜库 · 瀑布流 · 妆伴</title>
    <style id="theme-vars">
/* ═══════════════════════════════════════════════════════════
   MakeupPal V2 Brand CSS — Rose Gold × Sunset Orange
   ═══════════════════════════════════════════════════════════ */
:root {
  /* ── Brand Colors ── */
  --mp-rose-gold: #C4956A;
  --mp-rose-light: #E8C9A8;
  --mp-rose-dark: #A67B52;
  --mp-sunset: #FF8C42;
  --mp-peach: #FFC1A1;
  --mp-champagne: #D4A574;

  /* ── Semantic Colors ── */
  --mp-success: #7DB87A;
  --mp-warning: #D4A03C;
  --mp-error: #E07866;
  --mp-info: #5B8EC4;

  /* ── Neutral Colors ── */
  --mp-bg: #FFF6EC;
  --mp-bg-white: #FFFFFF;
  --mp-text-primary: #4A2511;
  --mp-text-secondary: #6B3A1F;
  --mp-text-tertiary: #9B8576;
  --mp-border: #E8DDD2;
  --mp-border-light: #F0E8DC;

  /* ── Gradients ── */
  --mp-gradient-primary: linear-gradient(to right, #C4956A, #FF8C42);
  --mp-gradient-soft: linear-gradient(to right, #C4956A, #D4B896);
  --mp-gradient-sunset: linear-gradient(to right, #FF8C42, #FFC1A1);
  --mp-gradient-hero: linear-gradient(to right, #C4956A, #FF8C42 60%, #FFC1A1);
  --mp-gradient-gp: linear-gradient(to right, #A67B52, #C4956A);
  --mp-gradient-card-img: linear-gradient(to bottom, #FFC1A1, #E8943A 50%, #A65940);

  /* ── Font Families ── */
  --mp-font-display: 'Outfit', system-ui, sans-serif;
  --mp-font-body: 'Inter', system-ui, sans-serif;
  --mp-font-cn: 'Sarasa Gothic SC', 'PingFang SC', 'Noto Sans SC', sans-serif;

  /* ── Type Scale ── */
  --mp-text-hero: 56px;
  --mp-text-title1: 28px;
  --mp-text-title2: 17px;
  --mp-text-heading: 14px;
  --mp-text-body: 13px;
  --mp-text-caption: 12px;
  --mp-text-small: 11px;

  /* ── Radius Scale ── */
  --mp-radius-xs: 4px;
  --mp-radius-sm: 8px;
  --mp-radius-md: 12px;
  --mp-radius-lg: 16px;
  --mp-radius-xl: 24px;
  --mp-radius-2xl: 32px;
  --mp-radius-full: 9999px;
  --mp-radius-pill: 50px;
  --mp-radius-tab: 36px;

  /* ── Spacing Scale ── */
  --mp-space-1: 4px;
  --mp-space-2: 8px;
  --mp-space-3: 12px;
  --mp-space-4: 16px;
  --mp-space-5: 20px;
  --mp-space-6: 24px;
  --mp-space-8: 32px;
  --mp-space-12: 48px;

  /* ── Shadows (Warm Tone) ── */
  --mp-shadow-xs: 0 2px 8px rgba(196, 149, 106, 0.06);
  --mp-shadow-sm: 0 4px 16px rgba(196, 149, 106, 0.08);
  --mp-shadow-md: 0 8px 24px rgba(196, 149, 106, 0.12);
  --mp-shadow-lg: 0 16px 48px rgba(196, 149, 106, 0.16);
  --mp-shadow-btn: 0 4px 16px rgba(196, 149, 106, 0.30);
  --mp-shadow-gp: 0 8px 24px rgba(166, 123, 82, 0.25);

  /* ── Transitions ── */
  --mp-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

  /* ── Layout Tokens ── */
  --mp-tab-bar-height: 56px;
  --mp-header-height: 56px;
  --mp-safe-bottom: env(safe-area-inset-bottom, 0px);
  --mp-safe-top: env(safe-area-inset-top, 0px);
  --mp-content-max-width: 414px;

  /* ── Z-index ── */
  --mp-z-tab: 100;
  --mp-z-sheet: 200;
  --mp-z-modal: 300;
  --mp-z-toast: 400;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--mp-border);
  }
  @layer base {
    body { background: var(--mp-background); color: var(--mp-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="pb-[72px]">
        <!-- Top Bar -->
        <header class="sticky top-0 z-50 flex items-center justify-between px-4 h-14" style="background: color-mix(in srgb, var(--mp-bg) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
            <button class="inline-flex items-center justify-center w-9 h-9 rounded-lg" style="color: var(--mp-text-primary);" aria-label="返回">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <h1 class="text-base font-semibold tracking-tight" style="font-family: var(--mp-font-cn); color: var(--mp-text-primary);">颜库</h1>
            <button data-dom-id="mode-toggle" class="inline-flex items-center justify-center w-9 h-9 rounded-lg" style="color: var(--mp-text-primary);" aria-label="切换模式">
                <i data-lucide="layout-grid" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- Category Tabs -->
        <nav class="px-4 pt-2 pb-1">
            <div class="flex gap-1 overflow-x-auto no-scrollbar py-1 px-1" style="scroll-snap-type: x mandatory;">
                <button data-dom-id="tab-all" class="shrink-0 whitespace-nowrap px-4 py-1.5 text-xs font-medium transition-colors" style="background: var(--mp-gradient-primary); color: #FFFFFF; border-radius: var(--mp-radius-pill); font-family: var(--mp-font-cn);">全部</button>
                <button data-dom-id="tab-daily" class="shrink-0 whitespace-nowrap px-4 py-1.5 text-xs font-medium transition-colors" style="background: transparent; color: var(--mp-text-secondary); border-radius: var(--mp-radius-pill); font-family: var(--mp-font-cn);">日常</button>
                <button data-dom-id="tab-sweet" class="shrink-0 whitespace-nowrap px-4 py-1.5 text-xs font-medium transition-colors" style="background: transparent; color: var(--mp-text-secondary); border-radius: var(--mp-radius-pill); font-family: var(--mp-font-cn);">甜酷</button>
                <button data-dom-id="tab-retro" class="shrink-0 whitespace-nowrap px-4 py-1.5 text-xs font-medium transition-colors" style="background: transparent; color: var(--mp-text-secondary); border-radius: var(--mp-radius-pill); font-family: var(--mp-font-cn);">复古</button>
                <button data-dom-id="tab-fresh" class="shrink-0 whitespace-nowrap px-4 py-1.5 text-xs font-medium transition-colors" style="background: transparent; color: var(--mp-text-secondary); border-radius: var(--mp-radius-pill); font-family: var(--mp-font-cn);">元气</button>
                <button data-dom-id="tab-work" class="shrink-0 whitespace-nowrap px-4 py-1.5 text-xs font-medium transition-colors" style="background: transparent; color: var(--mp-text-secondary); border-radius: var(--mp-radius-pill); font-family: var(--mp-font-cn);">职场</button>
                <button data-dom-id="tab-date" class="shrink-0 whitespace-nowrap px-4 py-1.5 text-xs font-medium transition-colors" style="background: transparent; color: var(--mp-text-secondary); border-radius: var(--mp-radius-pill); font-family: var(--mp-font-cn);">约会</button>
                <button data-dom-id="tab-party" class="shrink-0 whitespace-nowrap px-4 py-1.5 text-xs font-medium transition-colors" style="background: transparent; color: var(--mp-text-secondary); border-radius: var(--mp-radius-pill); font-family: var(--mp-font-cn);">派对</button>
            </div>
        </nav>

        <!-- Sort/Filter Row -->
        <div class="flex items-center justify-between px-4 pt-2 pb-3">
            <span class="text-xs" style="font-family: var(--mp-font-display); color: var(--mp-text-tertiary);">共 <span style="font-family: var(--mp-font-display); color: var(--mp-text-secondary); font-weight: 600;">128</span> 个妆容</span>
            <button class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg" style="background: var(--mp-bg-white); color: var(--mp-text-secondary);">
                <span class="text-xs" style="font-family: var(--mp-font-cn);">最热</span>
                <i data-lucide="chevron-down" class="w-3 h-3"></i>
                <i data-lucide="sliders-horizontal" class="w-3 h-3 ml-1" style="color: var(--mp-text-tertiary);"></i>
            </button>
        </div>

        <!-- Waterfall Grid -->
        <div class="px-4">
            <div style="column-count: 2; column-gap: 8px;">

                <!-- Card 1: Tall -->
                <article class="mb-2 break-inside-avoid" style="border-radius: var(--mp-radius-xl); box-shadow: var(--mp-shadow-xs); background: var(--mp-bg-white); overflow: hidden; transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s cubic-bezier(0.4,0,0.2,1);">
                    <div class="relative" style="height: 200px;">
                        <img src="../assets/image_5_yi19x4.jpg" alt="蜜桃甜心妆" class="w-full h-full object-cover" loading="lazy">
                    </div>
                    <div class="p-3">
                        <h3 class="text-sm font-semibold truncate" style="font-family: var(--mp-font-cn); color: var(--mp-text-primary);">蜜桃甜心妆</h3>
                        <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-sunset); font-family: var(--mp-font-cn);">#蜜桃</span>
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-rose-gold); font-family: var(--mp-font-cn);">#日常</span>
                        </div>
                        <div class="flex items-center justify-between mt-2.5">
                            <div class="flex items-center gap-1">
                                <i data-lucide="heart" class="w-3 h-3" style="color: var(--mp-error);"></i>
                                <span class="text-[11px]" style="font-family: var(--mp-font-display); color: var(--mp-text-tertiary);">2.3k</span>
                            </div>
                            <span class="text-[10px] px-2 py-0.5 rounded-md font-medium" style="background: var(--mp-bg); color: var(--mp-success); font-family: var(--mp-font-cn);">简单</span>
                        </div>
                    </div>
                </article>

                <!-- Card 2: Short -->
                <article class="mb-2 break-inside-avoid" style="border-radius: var(--mp-radius-xl); box-shadow: var(--mp-shadow-xs); background: var(--mp-bg-white); overflow: hidden; transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s cubic-bezier(0.4,0,0.2,1);">
                    <div class="relative" style="height: 140px;">
                        <img src="../assets/image_4_yi19x4.jpg" alt="晚霞玫瑰妆" class="w-full h-full object-cover" loading="lazy">
                    </div>
                    <div class="p-3">
                        <h3 class="text-sm font-semibold truncate" style="font-family: var(--mp-font-cn); color: var(--mp-text-primary);">晚霞玫瑰妆</h3>
                        <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-sunset); font-family: var(--mp-font-cn);">#玫瑰</span>
                        </div>
                        <div class="flex items-center justify-between mt-2.5">
                            <div class="flex items-center gap-1">
                                <i data-lucide="heart" class="w-3 h-3" style="color: var(--mp-error);"></i>
                                <span class="text-[11px]" style="font-family: var(--mp-font-display); color: var(--mp-text-tertiary);">1.8k</span>
                            </div>
                            <span class="text-[10px] px-2 py-0.5 rounded-md font-medium" style="background: var(--mp-bg); color: var(--mp-warning); font-family: var(--mp-font-cn);">中等</span>
                        </div>
                    </div>
                </article>

                <!-- Card 3: Tall -->
                <article class="mb-2 break-inside-avoid" style="border-radius: var(--mp-radius-xl); box-shadow: var(--mp-shadow-xs); background: var(--mp-bg-white); overflow: hidden; transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s cubic-bezier(0.4,0,0.2,1);">
                    <div class="relative" style="height: 210px;">
                        <img src="../assets/image_3_yi19x4.jpg" alt="复古红唇妆" class="w-full h-full object-cover" loading="lazy">
                    </div>
                    <div class="p-3">
                        <h3 class="text-sm font-semibold truncate" style="font-family: var(--mp-font-cn); color: var(--mp-text-primary);">复古红唇妆</h3>
                        <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-rose-gold); font-family: var(--mp-font-cn);">#复古</span>
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-sunset); font-family: var(--mp-font-cn);">#红唇</span>
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-champagne); font-family: var(--mp-font-cn);">#约会</span>
                        </div>
                        <div class="flex items-center justify-between mt-2.5">
                            <div class="flex items-center gap-1">
                                <i data-lucide="heart" class="w-3 h-3" style="color: var(--mp-error);"></i>
                                <span class="text-[11px]" style="font-family: var(--mp-font-display); color: var(--mp-text-tertiary);">4.1k</span>
                            </div>
                            <span class="text-[10px] px-2 py-0.5 rounded-md font-medium" style="background: var(--mp-bg); color: var(--mp-error); font-family: var(--mp-font-cn);">进阶</span>
                        </div>
                    </div>
                </article>

                <!-- Card 4: Medium with tutorial -->
                <article class="mb-2 break-inside-avoid" style="border-radius: var(--mp-radius-xl); box-shadow: var(--mp-shadow-xs); background: var(--mp-bg-white); overflow: hidden; transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s cubic-bezier(0.4,0,0.2,1);">
                    <div class="relative" style="height: 160px;">
                        <img src="../assets/image_1_yi19x4.jpg" alt="通勤裸妆教程" class="w-full h-full object-cover" loading="lazy">
                        <span class="absolute top-2 left-2 text-[10px] px-2 py-0.5 rounded-md font-medium" style="background: rgba(74,37,17,0.7); color: #FFFFFF; font-family: var(--mp-font-cn);">教程</span>
                    </div>
                    <div class="p-3">
                        <h3 class="text-sm font-semibold truncate" style="font-family: var(--mp-font-cn); color: var(--mp-text-primary);">通勤裸妆教程</h3>
                        <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-sunset); font-family: var(--mp-font-cn);">#职场</span>
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-rose-gold); font-family: var(--mp-font-cn);">#裸妆</span>
                        </div>
                        <div class="flex items-center justify-between mt-2.5">
                            <div class="flex items-center gap-1">
                                <i data-lucide="heart" class="w-3 h-3" style="color: var(--mp-error);"></i>
                                <span class="text-[11px]" style="font-family: var(--mp-font-display); color: var(--mp-text-tertiary);">956</span>
                            </div>
                            <span class="text-[10px] px-2 py-0.5 rounded-md font-medium" style="background: var(--mp-bg); color: var(--mp-success); font-family: var(--mp-font-cn);">简单</span>
                        </div>
                    </div>
                </article>

                <!-- Card 5: Short (gradient fallback) -->
                <article class="mb-2 break-inside-avoid" style="border-radius: var(--mp-radius-xl); box-shadow: var(--mp-shadow-xs); background: var(--mp-bg-white); overflow: hidden; transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s cubic-bezier(0.4,0,0.2,1);">
                    <div class="relative" style="height: 130px; background: var(--mp-gradient-card-img);">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <i data-lucide="sparkles" class="w-8 h-8" style="color: rgba(255,255,255,0.4);"></i>
                        </div>
                    </div>
                    <div class="p-3">
                        <h3 class="text-sm font-semibold truncate" style="font-family: var(--mp-font-cn); color: var(--mp-text-primary);">元气满满妆</h3>
                        <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-sunset); font-family: var(--mp-font-cn);">#元气</span>
                        </div>
                        <div class="flex items-center justify-between mt-2.5">
                            <div class="flex items-center gap-1">
                                <i data-lucide="heart" class="w-3 h-3" style="color: var(--mp-error);"></i>
                                <span class="text-[11px]" style="font-family: var(--mp-font-display); color: var(--mp-text-tertiary);">3.2k</span>
                            </div>
                            <span class="text-[10px] px-2 py-0.5 rounded-md font-medium" style="background: var(--mp-bg); color: var(--mp-success); font-family: var(--mp-font-cn);">简单</span>
                        </div>
                    </div>
                </article>

                <!-- Card 6: Tall (gradient fallback) -->
                <article class="mb-2 break-inside-avoid" style="border-radius: var(--mp-radius-xl); box-shadow: var(--mp-shadow-xs); background: var(--mp-bg-white); overflow: hidden; transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s cubic-bezier(0.4,0,0.2,1);">
                    <div class="relative" style="height: 190px; background: var(--mp-gradient-sunset);">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <i data-lucide="sparkles" class="w-8 h-8" style="color: rgba(255,255,255,0.4);"></i>
                        </div>
                    </div>
                    <div class="p-3">
                        <h3 class="text-sm font-semibold truncate" style="font-family: var(--mp-font-cn); color: var(--mp-text-primary);">派对女王妆</h3>
                        <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-rose-gold); font-family: var(--mp-font-cn);">#派对</span>
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-sunset); font-family: var(--mp-font-cn);">#闪亮</span>
                        </div>
                        <div class="flex items-center justify-between mt-2.5">
                            <div class="flex items-center gap-1">
                                <i data-lucide="heart" class="w-3 h-3" style="color: var(--mp-error);"></i>
                                <span class="text-[11px]" style="font-family: var(--mp-font-display); color: var(--mp-text-tertiary);">5.7k</span>
                            </div>
                            <span class="text-[10px] px-2 py-0.5 rounded-md font-medium" style="background: var(--mp-bg); color: var(--mp-error); font-family: var(--mp-font-cn);">进阶</span>
                        </div>
                    </div>
                </article>

                <!-- Card 7: Medium (gradient fallback) -->
                <article class="mb-2 break-inside-avoid" style="border-radius: var(--mp-radius-xl); box-shadow: var(--mp-shadow-xs); background: var(--mp-bg-white); overflow: hidden; transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s cubic-bezier(0.4,0,0.2,1);">
                    <div class="relative" style="height: 155px; background: var(--mp-gradient-soft);">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <i data-lucide="sparkles" class="w-8 h-8" style="color: rgba(255,255,255,0.4);"></i>
                        </div>
                    </div>
                    <div class="p-3">
                        <h3 class="text-sm font-semibold truncate" style="font-family: var(--mp-font-cn); color: var(--mp-text-primary);">温柔奶茶妆</h3>
                        <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-champagne); font-family: var(--mp-font-cn);">#温柔</span>
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-rose-gold); font-family: var(--mp-font-cn);">#约会</span>
                        </div>
                        <div class="flex items-center justify-between mt-2.5">
                            <div class="flex items-center gap-1">
                                <i data-lucide="heart" class="w-3 h-3" style="color: var(--mp-error);"></i>
                                <span class="text-[11px]" style="font-family: var(--mp-font-display); color: var(--mp-text-tertiary);">1.5k</span>
                            </div>
                            <span class="text-[10px] px-2 py-0.5 rounded-md font-medium" style="background: var(--mp-bg); color: var(--mp-success); font-family: var(--mp-font-cn);">简单</span>
                        </div>
                    </div>
                </article>

                <!-- Card 8: Short (gradient fallback) -->
                <article class="mb-2 break-inside-avoid" style="border-radius: var(--mp-radius-xl); box-shadow: var(--mp-shadow-xs); background: var(--mp-bg-white); overflow: hidden; transition: transform 0.2s cubic-bezier(0.4,0,0.2,1), box-shadow 0.2s cubic-bezier(0.4,0,0.2,1);">
                    <div class="relative" style="height: 145px; background: var(--mp-gradient-gp);">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <i data-lucide="sparkles" class="w-8 h-8" style="color: rgba(255,255,255,0.4);"></i>
                        </div>
                    </div>
                    <div class="p-3">
                        <h3 class="text-sm font-semibold truncate" style="font-family: var(--mp-font-cn); color: var(--mp-text-primary);">酷辣机车妆</h3>
                        <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
                            <span class="text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap" style="background: var(--mp-bg); color: var(--mp-rose-gold); font-family: var(--mp-font-cn);">#甜酷</span>
                        </div>
                        <div class="flex items-center justify-between mt-2.5">
                            <div class="flex items-center gap-1">
                                <i data-lucide="heart" class="w-3 h-3" style="color: var(--mp-error);"></i>
                                <span class="text-[11px]" style="font-family: var(--mp-font-display); color: var(--mp-text-tertiary);">2.8k</span>
                            </div>
                            <span class="text-[10px] px-2 py-0.5 rounded-md font-medium" style="background: var(--mp-bg); color: var(--mp-warning); font-family: var(--mp-font-cn);">中等</span>
                        </div>
                    </div>
                </article>

            </div>
        </div>

        <!-- Tab Bar -->
        <nav class="fixed bottom-0 left-0 right-0 z-[100]" style="padding-bottom: var(--mp-safe-bottom);">
            <div class="mx-4 mb-2" style="background: var(--mp-bg-white); border-radius: var(--mp-radius-2xl); box-shadow: var(--mp-shadow-md); padding: 6px 8px;">
                <div class="flex items-center justify-around">
                    <button data-dom-id="tab-home" class="flex flex-col items-center gap-0.5 px-3 py-1.5" style="color: var(--mp-text-tertiary);">
                        <i data-lucide="home" class="w-5 h-5"></i>
                        <span class="text-[10px]" style="font-family: var(--mp-font-cn);">首页</span>
                    </button>
                    <button data-dom-id="tab-library" class="flex flex-col items-center gap-0.5 px-3 py-1.5" style="color: var(--mp-rose-gold);">
                        <i data-lucide="palette" class="w-5 h-5"></i>
                        <span class="text-[10px] font-semibold" style="font-family: var(--mp-font-cn); color: var(--mp-sunset);">颜库</span>
                    </button>
                    <button data-dom-id="tab-mirror" class="flex items-center justify-center w-11 h-11 rounded-2xl -mt-4" style="background: var(--mp-gradient-primary); box-shadow: var(--mp-shadow-btn);">
                        <i data-lucide="sparkles" class="w-5 h-5" style="color: #FFFFFF;"></i>
                    </button>
                    <button data-dom-id="tab-mall" class="flex flex-col items-center gap-0.5 px-3 py-1.5" style="color: var(--mp-text-tertiary);">
                        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                        <span class="text-[10px]" style="font-family: var(--mp-font-cn);">市集</span>
                    </button>
                    <button data-dom-id="tab-profile" class="flex flex-col items-center gap-0.5 px-3 py-1.5" style="color: var(--mp-text-tertiary);">
                        <i data-lucide="user" class="w-5 h-5"></i>
                        <span class="text-[10px]" style="font-family: var(--mp-font-cn);">我的</span>
                    </button>
                </div>
            </div>
        </nav>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>

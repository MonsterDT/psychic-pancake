<!DOCTYPE html>
<html lang="en" class="light" data-theme="light">

    <style id="theme-vars">
/* ═══════════════════════════════════════════════════════════
   MakeupPal V2 Brand CSS — Rose Gold × Sunset Orange
   ═══════════════════════════════════════════════════════════ */
:root {
  /* ── Brand Colors ── */
  --mp-rose-gold: #C4956A;
  --mp-rose-light: #E8C9A8;
  --mp-rose-dark: #A67B52;
  --mp-sunset: #FF8C42;
  --mp-peach: #FFC1A1;
  --mp-champagne: #D4A574;

  /* ── Semantic Colors ── */
  --mp-success: #7DB87A;
  --mp-warning: #D4A03C;
  --mp-error: #E07866;
  --mp-info: #5B8EC4;

  /* ── Neutral Colors ── */
  --mp-bg: #FFF6EC;
  --mp-bg-white: #FFFFFF;
  --mp-text-primary: #4A2511;
  --mp-text-secondary: #6B3A1F;
  --mp-text-tertiary: #9B8576;
  --mp-border: #E8DDD2;
  --mp-border-light: #F0E8DC;

  /* ── Gradients ── */
  --mp-gradient-primary: linear-gradient(to right, #C4956A, #FF8C42);
  --mp-gradient-soft: linear-gradient(to right, #C4956A, #D4B896);
  --mp-gradient-sunset: linear-gradient(to right, #FF8C42, #FFC1A1);
  --mp-gradient-hero: linear-gradient(to right, #C4956A, #FF8C42 60%, #FFC1A1);
  --mp-gradient-gp: linear-gradient(to right, #A67B52, #C4956A);
  --mp-gradient-card-img: linear-gradient(to bottom, #FFC1A1, #E8943A 50%, #A65940);

  /* ── Font Families ── */
  --mp-font-display: 'Outfit', system-ui, sans-serif;
  --mp-font-body: 'Inter', system-ui, sans-serif;
  --mp-font-cn: 'Sarasa Gothic SC', 'PingFang SC', 'Noto Sans SC', sans-serif;

  /* ── Type Scale ── */
  --mp-text-hero: 56px;
  --mp-text-title1: 28px;
  --mp-text-title2: 17px;
  --mp-text-heading: 14px;
  --mp-text-body: 13px;
  --mp-text-caption: 12px;
  --mp-text-small: 11px;

  /* ── Radius Scale ── */
  --mp-radius-xs: 4px;
  --mp-radius-sm: 8px;
  --mp-radius-md: 12px;
  --mp-radius-lg: 16px;
  --mp-radius-xl: 24px;
  --mp-radius-2xl: 32px;
  --mp-radius-full: 9999px;
  --mp-radius-pill: 50px;
  --mp-radius-tab: 36px;

  /* ── Spacing Scale ── */
  --mp-space-1: 4px;
  --mp-space-2: 8px;
  --mp-space-3: 12px;
  --mp-space-4: 16px;
  --mp-space-5: 20px;
  --mp-space-6: 24px;
  --mp-space-8: 32px;
  --mp-space-12: 48px;

  /* ── Shadows (Warm Tone) ── */
  --mp-shadow-xs: 0 2px 8px rgba(196, 149, 106, 0.06);
  --mp-shadow-sm: 0 4px 16px rgba(196, 149, 106, 0.08);
  --mp-shadow-md: 0 8px 24px rgba(196, 149, 106, 0.12);
  --mp-shadow-lg: 0 16px 48px rgba(196, 149, 106, 0.16);
  --mp-shadow-btn: 0 4px 16px rgba(196, 149, 106, 0.30);
  --mp-shadow-gp: 0 8px 24px rgba(166, 123, 82, 0.25);

  /* ── Transitions ── */
  --mp-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

  /* ── Layout Tokens ── */
  --mp-tab-bar-height: 56px;
  --mp-header-height: 56px;
  --mp-safe-bottom: env(safe-area-inset-bottom, 0px);
  --mp-safe-top: env(safe-area-inset-top, 0px);
  --mp-content-max-width: 414px;

  /* ── Z-index ── */
  --mp-z-tab: 100;
  --mp-z-sheet: 200;
  --mp-z-modal: 300;
  --mp-z-toast: 400;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--mp-border);
  }
  @layer base {
    body { background: var(--mp-background); color: var(--mp-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }

        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

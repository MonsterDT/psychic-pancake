<!DOCTYPE html>
<html lang="en" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜库 · 妆伴</title>
    <style id="theme-vars">
/* ═══════════════════════════════════════════════════════════
   MakeupPal V2 Brand CSS — Rose Gold × Sunset Orange
   ═══════════════════════════════════════════════════════════ */
:root {
  /* ── Brand Colors ── */
  --mp-rose-gold: #C4956A;
  --mp-rose-light: #E8C9A8;
  --mp-rose-dark: #A67B52;
  --mp-sunset: #FF8C42;
  --mp-peach: #FFC1A1;
  --mp-champagne: #D4A574;

  /* ── Semantic Colors ── */
  --mp-success: #7DB87A;
  --mp-warning: #D4A03C;
  --mp-error: #E07866;
  --mp-info: #5B8EC4;

  /* ── Neutral Colors ── */
  --mp-bg: #FFF6EC;
  --mp-bg-white: #FFFFFF;
  --mp-text-primary: #4A2511;
  --mp-text-secondary: #6B3A1F;
  --mp-text-tertiary: #9B8576;
  --mp-border: #E8DDD2;
  --mp-border-light: #F0E8DC;

  /* ── Gradients ── */
  --mp-gradient-primary: linear-gradient(to right, #C4956A, #FF8C42);
  --mp-gradient-soft: linear-gradient(to right, #C4956A, #D4B896);
  --mp-gradient-sunset: linear-gradient(to right, #FF8C42, #FFC1A1);
  --mp-gradient-hero: linear-gradient(to right, #C4956A, #FF8C42 60%, #FFC1A1);
  --mp-gradient-gp: linear-gradient(to right, #A67B52, #C4956A);
  --mp-gradient-card-img: linear-gradient(to bottom, #FFC1A1, #E8943A 50%, #A65940);

  /* ── Font Families ── */
  --mp-font-display: 'Outfit', system-ui, sans-serif;
  --mp-font-body: 'Inter', system-ui, sans-serif;
  --mp-font-cn: 'Sarasa Gothic SC', 'PingFang SC', 'Noto Sans SC', sans-serif;

  /* ── Type Scale ── */
  --mp-text-hero: 56px;
  --mp-text-title1: 28px;
  --mp-text-title2: 17px;
  --mp-text-heading: 14px;
  --mp-text-body: 13px;
  --mp-text-caption: 12px;
  --mp-text-small: 11px;

  /* ── Radius Scale ── */
  --mp-radius-xs: 4px;
  --mp-radius-sm: 8px;
  --mp-radius-md: 12px;
  --mp-radius-lg: 16px;
  --mp-radius-xl: 24px;
  --mp-radius-2xl: 32px;
  --mp-radius-full: 9999px;
  --mp-radius-pill: 50px;
  --mp-radius-tab: 36px;

  /* ── Spacing Scale ── */
  --mp-space-1: 4px;
  --mp-space-2: 8px;
  --mp-space-3: 12px;
  --mp-space-4: 16px;
  --mp-space-5: 20px;
  --mp-space-6: 24px;
  --mp-space-8: 32px;
  --mp-space-12: 48px;

  /* ── Shadows (Warm Tone) ── */
  --mp-shadow-xs: 0 2px 8px rgba(196, 149, 106, 0.06);
  --mp-shadow-sm: 0 4px 16px rgba(196, 149, 106, 0.08);
  --mp-shadow-md: 0 8px 24px rgba(196, 149, 106, 0.12);
  --mp-shadow-lg: 0 16px 48px rgba(196, 149, 106, 0.16);
  --mp-shadow-btn: 0 4px 16px rgba(196, 149, 106, 0.30);
  --mp-shadow-gp: 0 8px 24px rgba(166, 123, 82, 0.25);

  /* ── Transitions ── */
  --mp-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

  /* ── Layout Tokens ── */
  --mp-tab-bar-height: 56px;
  --mp-header-height: 56px;
  --mp-safe-bottom: env(safe-area-inset-bottom, 0px);
  --mp-safe-top: env(safe-area-inset-top, 0px);
  --mp-content-max-width: 414px;

  /* ── Z-index ── */
  --mp-z-tab: 100;
  --mp-z-sheet: 200;
  --mp-z-modal: 300;
  --mp-z-toast: 400;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--mp-border);
  }
  @layer base {
    body { background: var(--mp-background); color: var(--mp-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--mp-font-cn);">
    <main class="relative min-h-screen flex flex-col" style="background: var(--mp-bg);">

        <!-- ── 1. Top Bar ── -->
        <header class="flex items-center justify-between px-4 pt-3 pb-2" style="height: var(--mp-header-height);">
            <button class="w-10 h-10 flex items-center justify-center rounded-full" style="background: rgba(255,255,255,0.7);" aria-label="Back">
                <i data-lucide="chevron-left" class="w-5 h-5" style="color: var(--mp-text-primary);"></i>
            </button>
            <h1 class="text-[17px] font-semibold" style="color: var(--mp-text-primary); font-family: var(--mp-font-cn);">颜库</h1>
            <button data-dom-id="mode-toggle" class="w-10 h-10 flex items-center justify-center rounded-full" style="background: rgba(255,255,255,0.7);" aria-label="Switch view mode">
                <i data-lucide="layout-grid" class="w-5 h-5" style="color: var(--mp-text-secondary);"></i>
            </button>
        </header>

        <!-- ── 2. Card Stack ── -->
        <section class="flex-1 flex items-center justify-center" style="padding-top: var(--mp-space-2); padding-bottom: var(--mp-space-4);">
            <div class="relative" style="width: 280px; height: 380px;">

                <!-- Third card (furthest back) -->
                <div class="absolute" style="top: 24px; left: 50%; transform: translateX(-50%); width: 260px; height: 380px; border-radius: var(--mp-radius-xl); box-shadow: var(--mp-shadow-sm); opacity: 0.8; overflow: hidden;">
                    <img src="../assets/image_3_yi19x4.jpg" alt="Look card 3" class="w-full h-full object-cover" style="border-radius: var(--mp-radius-xl);">
                    <div class="absolute inset-0" style="background: var(--mp-gradient-card-img); opacity: 0.3; border-radius: var(--mp-radius-xl);"></div>
                </div>

                <!-- Second card (middle) -->
                <div class="absolute" style="top: 12px; left: 50%; transform: translateX(-50%); width: 270px; height: 380px; border-radius: var(--mp-radius-xl); box-shadow: var(--mp-shadow-md); opacity: 0.9; overflow: hidden;">
                    <img src="../assets/image_4_yi19x4.jpg" alt="Look card 2" class="w-full h-full object-cover" style="border-radius: var(--mp-radius-xl);">
                    <div class="absolute inset-0" style="background: var(--mp-gradient-card-img); opacity: 0.2; border-radius: var(--mp-radius-xl);"></div>
                </div>

                <!-- Front card (top) -->
                <div class="relative" style="width: 280px; height: 380px; border-radius: var(--mp-radius-xl); box-shadow: var(--mp-shadow-lg); overflow: hidden;">
                    <img src="../assets/image_5_yi19x4.jpg" alt="春日桃花妆 look" class="w-full h-full object-cover">
                    <div class="absolute inset-0" style="background: var(--mp-gradient-card-img); opacity: 0.15;"></div>

                    <!-- Bottom overlay info -->
                    <div class="absolute bottom-0 left-0 right-0 p-5" style="background: linear-gradient(to top, rgba(74,37,17,0.6) 0%, transparent 100%);">
                        <h2 class="text-[18px] font-semibold text-white mb-2" style="font-family: var(--mp-font-cn); text-shadow: 0 1px 4px rgba(0,0,0,0.2);">春日桃花妆</h2>
                        <div class="flex gap-2">
                            <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-[11px] font-medium text-white whitespace-nowrap" style="background: rgba(255,255,255,0.2); backdrop-filter: blur(4px);">#桃花</span>
                            <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-[11px] font-medium text-white whitespace-nowrap" style="background: rgba(255,255,255,0.2); backdrop-filter: blur(4px);">#日常</span>
                        </div>
                    </div>

                    <!-- LIKE badge -->
                    <div class="absolute top-4 right-4 w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--mp-peach); transform: rotate(-12deg); box-shadow: var(--mp-shadow-sm);">
                        <i data-lucide="heart" class="w-5 h-5 text-white" style="fill: white;"></i>
                    </div>
                </div>

            </div>
        </section>

        <!-- ── 3. Swipe Action Buttons ── -->
        <section class="flex items-center justify-center gap-6 py-4">
            <!-- Skip button -->
            <button class="w-14 h-14 rounded-full flex items-center justify-center" style="background: var(--mp-bg-white); border: 2px solid var(--mp-border); box-shadow: var(--mp-shadow-sm);" aria-label="Skip">
                <span class="text-[20px] font-light" style="color: var(--mp-text-tertiary);">&#x2715;</span>
            </button>
            <!-- Hint text -->
            <span class="text-[11px] whitespace-nowrap" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-cn);">左滑跳过 · 右滑喜欢</span>
            <!-- Like button -->
            <button class="w-14 h-14 rounded-full flex items-center justify-center" style="background: var(--mp-gradient-primary); box-shadow: var(--mp-shadow-btn);" aria-label="Like">
                <i data-lucide="heart" class="w-6 h-6 text-white"></i>
            </button>
        </section>

        <!-- ── 4. Bottom Info Bar ── -->
        <section class="flex items-center justify-center gap-5 px-6 py-3">
            <div class="flex items-center gap-2">
                <img src="../assets/image_2_yi19x4.jpg" alt="Makeup artist" class="w-7 h-7 rounded-full object-cover" style="border: 1.5px solid var(--mp-border-light);">
                <span class="text-[12px]" style="color: var(--mp-text-secondary); font-family: var(--mp-font-cn);">小桃老师</span>
            </div>
            <div class="h-4" style="width: 1px; background: var(--mp-border);"></div>
            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium" style="background: rgba(196,149,106,0.12); color: var(--mp-rose-dark); font-family: var(--mp-font-cn);">简单</span>
            <div class="h-4" style="width: 1px; background: var(--mp-border);"></div>
            <div class="flex items-center gap-1">
                <i data-lucide="eye" class="w-3.5 h-3.5" style="color: var(--mp-text-tertiary);"></i>
                <span class="text-[12px]" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-display);">2.3k</span>
            </div>
        </section>

        <!-- ── 5. Tab Bar (Floating Pill) ── -->
        <nav class="fixed bottom-0 inset-x-0 flex justify-center pb-3 pt-2" style="z-index: var(--mp-z-tab); background: linear-gradient(to top, var(--mp-bg) 60%, transparent);">
            <div class="flex items-center rounded-full px-1.5 py-1" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); box-shadow: var(--mp-shadow-lg);">
                <!-- Tab: 首页 -->
                <a data-dom-id="tab-home" href="home.html" class="flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-full" style="min-width: 48px;">
                    <i data-lucide="home" class="w-5 h-5" style="color: var(--mp-text-tertiary);"></i>
                    <span class="text-[10px]" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-cn);">首页</span>
                </a>
                <!-- Tab: 颜库 (active) -->
                <a data-dom-id="tab-library" href="#" class="flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-full" style="min-width: 48px; background: var(--mp-gradient-primary);">
                    <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                    <span class="text-[10px] text-white font-medium" style="font-family: var(--mp-font-cn);">颜库</span>
                </a>
                <!-- Tab: 焕新 (center elevated) -->
                <a data-dom-id="tab-mirror" href="mirror.html" class="flex flex-col items-center justify-center rounded-full" style="width: 52px; height: 52px; margin-top: -16px; background: var(--mp-gradient-primary); box-shadow: var(--mp-shadow-gp);">
                    <i data-lucide="camera" class="w-[22px] h-[22px] text-white"></i>
                    <span class="text-[10px] text-white font-medium" style="font-family: var(--mp-font-cn);">焕新</span>
                </a>
                <!-- Tab: 市集 -->
                <a data-dom-id="tab-mall" href="mall.html" class="flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-full" style="min-width: 48px;">
                    <i data-lucide="shopping-bag" class="w-5 h-5" style="color: var(--mp-text-tertiary);"></i>
                    <span class="text-[10px]" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-cn);">市集</span>
                </a>
                <!-- Tab: 我的 -->
                <a data-dom-id="tab-profile" href="profile.html" class="flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-full" style="min-width: 48px;">
                    <i data-lucide="user" class="w-5 h-5" style="color: var(--mp-text-tertiary);"></i>
                    <span class="text-[10px]" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-cn);">我的</span>
                </a>
            </div>
            <!-- Safe area -->
            <div style="height: var(--mp-safe-bottom);"></div>
        </nav>

    </main>

    <script>lucide.createIcons();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 · 妆伴</title>
    <style id="theme-vars">
/* ═══════════════════════════════════════════════════════════
   MakeupPal V2 Brand CSS — Rose Gold × Sunset Orange
   ═══════════════════════════════════════════════════════════ */
:root {
  /* ── Brand Colors ── */
  --mp-rose-gold: #C4956A;
  --mp-rose-light: #E8C9A8;
  --mp-rose-dark: #A67B52;
  --mp-sunset: #FF8C42;
  --mp-peach: #FFC1A1;
  --mp-champagne: #D4A574;

  /* ── Semantic Colors ── */
  --mp-success: #7DB87A;
  --mp-warning: #D4A03C;
  --mp-error: #E07866;
  --mp-info: #5B8EC4;

  /* ── Neutral Colors ── */
  --mp-bg: #FFF6EC;
  --mp-bg-white: #FFFFFF;
  --mp-text-primary: #4A2511;
  --mp-text-secondary: #6B3A1F;
  --mp-text-tertiary: #9B8576;
  --mp-border: #E8DDD2;
  --mp-border-light: #F0E8DC;

  /* ── Gradients ── */
  --mp-gradient-primary: linear-gradient(to right, #C4956A, #FF8C42);
  --mp-gradient-soft: linear-gradient(to right, #C4956A, #D4B896);
  --mp-gradient-sunset: linear-gradient(to right, #FF8C42, #FFC1A1);
  --mp-gradient-hero: linear-gradient(to right, #C4956A, #FF8C42 60%, #FFC1A1);
  --mp-gradient-gp: linear-gradient(to right, #A67B52, #C4956A);
  --mp-gradient-card-img: linear-gradient(to bottom, #FFC1A1, #E8943A 50%, #A65940);

  /* ── Font Families ── */
  --mp-font-display: 'Outfit', system-ui, sans-serif;
  --mp-font-body: 'Inter', system-ui, sans-serif;
  --mp-font-cn: 'Sarasa Gothic SC', 'PingFang SC', 'Noto Sans SC', sans-serif;

  /* ── Type Scale ── */
  --mp-text-hero: 56px;
  --mp-text-title1: 28px;
  --mp-text-title2: 17px;
  --mp-text-heading: 14px;
  --mp-text-body: 13px;
  --mp-text-caption: 12px;
  --mp-text-small: 11px;

  /* ── Radius Scale ── */
  --mp-radius-xs: 4px;
  --mp-radius-sm: 8px;
  --mp-radius-md: 12px;
  --mp-radius-lg: 16px;
  --mp-radius-xl: 24px;
  --mp-radius-2xl: 32px;
  --mp-radius-full: 9999px;
  --mp-radius-pill: 50px;
  --mp-radius-tab: 36px;

  /* ── Spacing Scale ── */
  --mp-space-1: 4px;
  --mp-space-2: 8px;
  --mp-space-3: 12px;
  --mp-space-4: 16px;
  --mp-space-5: 20px;
  --mp-space-6: 24px;
  --mp-space-8: 32px;
  --mp-space-12: 48px;

  /* ── Shadows (Warm Tone) ── */
  --mp-shadow-xs: 0 2px 8px rgba(196, 149, 106, 0.06);
  --mp-shadow-sm: 0 4px 16px rgba(196, 149, 106, 0.08);
  --mp-shadow-md: 0 8px 24px rgba(196, 149, 106, 0.12);
  --mp-shadow-lg: 0 16px 48px rgba(196, 149, 106, 0.16);
  --mp-shadow-btn: 0 4px 16px rgba(196, 149, 106, 0.30);
  --mp-shadow-gp: 0 8px 24px rgba(166, 123, 82, 0.25);

  /* ── Transitions ── */
  --mp-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

  /* ── Layout Tokens ── */
  --mp-tab-bar-height: 56px;
  --mp-header-height: 56px;
  --mp-safe-bottom: env(safe-area-inset-bottom, 0px);
  --mp-safe-top: env(safe-area-inset-top, 0px);
  --mp-content-max-width: 414px;

  /* ── Z-index ── */
  --mp-z-tab: 100;
  --mp-z-sheet: 200;
  --mp-z-modal: 300;
  --mp-z-toast: 400;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-border: var(--mp-border);
  }
  @layer base {
    body { background: var(--mp-background); color: var(--mp-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen antialiased" style="font-family: var(--mp-font-cn); background: var(--mp-bg);">

    <main class="max-w-[375px] mx-auto pb-24">

        <!-- ═══ 1. HEADER BAR ═══ -->
        <header class="sticky top-0 z-50 h-14 flex items-center justify-between px-4"
                style="background: rgba(255,246,236,0.85); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);">
            <span class="text-lg font-bold tracking-tight" style="color: var(--mp-rose-gold); font-family: var(--mp-font-cn);">妆伴</span>
            <div class="flex items-center gap-3">
                <button class="inline-flex items-center justify-center w-9 h-9" aria-label="通知">
                    <i data-lucide="bell" class="w-5 h-5" style="color: var(--mp-text-secondary);"></i>
                </button>
                <button class="inline-flex items-center justify-center w-9 h-9" aria-label="搜索">
                    <i data-lucide="search" class="w-5 h-5" style="color: var(--mp-text-secondary);"></i>
                </button>
            </div>
        </header>

        <!-- Content padding below header -->
        <div class="px-4 pt-4 flex flex-col gap-4">

            <!-- ═══ 2. FACE CONTOUR CARD ═══ -->
            <section class="rounded-3xl p-4 flex items-center gap-4"
                     style="background: var(--mp-bg-white); border-radius: var(--mp-radius-xl); box-shadow: var(--mp-shadow-md);">
                <div class="shrink-0 w-14 h-14 rounded-2xl flex items-center justify-center"
                     style="background: var(--mp-bg);">
                    <i data-lucide="scan-face" class="w-7 h-7" style="color: var(--mp-rose-gold);"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-semibold truncate" style="color: var(--mp-text-primary); font-family: var(--mp-font-cn);">面部轮廓分析</p>
                    <p class="text-xs mt-0.5" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-cn);">轮廓匹配度 <span class="font-semibold" style="color: var(--mp-rose-gold); font-family: var(--mp-font-display);">92</span><span style="color: var(--mp-text-tertiary);">/100</span></p>
                </div>
                <button class="shrink-0 px-5 py-2 text-xs font-semibold text-white"
                        style="background: var(--mp-gradient-primary); border-radius: var(--mp-radius-pill); box-shadow: var(--mp-shadow-btn); font-family: var(--mp-font-cn);">
                    开始分析
                </button>
            </section>

            <!-- ═══ 3. GP INDEX CARD ═══ -->
            <section class="rounded-3xl p-5"
                     style="background: var(--mp-gradient-gp); border-radius: var(--mp-radius-xl); box-shadow: var(--mp-shadow-gp);">
                <div class="flex items-baseline gap-3">
                    <span class="text-sm font-medium text-white/80" style="font-family: var(--mp-font-cn);">GP 指数</span>
                    <span class="text-xs text-white/60" style="font-family: var(--mp-font-cn);">综合美丽评分</span>
                </div>
                <div class="mt-2 flex items-baseline gap-2">
                    <span class="text-5xl font-bold text-white" style="font-family: var(--mp-font-display); font-variant-numeric: tabular-nums;">2,580</span>
                </div>
                <div class="mt-3 flex items-center gap-1.5">
                    <i data-lucide="trending-up" class="w-3 h-3 text-white/70"></i>
                    <span class="text-xs text-white/70" style="font-family: var(--mp-font-cn);">较上周 <span class="text-white font-semibold" style="font-family: var(--mp-font-display);">+120</span></span>
                </div>
            </section>

            <!-- ═══ 4. BANNER CAROUSEL ═══ -->
            <section>
                <div class="rounded-2xl overflow-hidden" style="border-radius: var(--mp-radius-lg);">
                    <img src="../assets/image_0_yi19x4.jpg" alt="妆伴推荐内容" class="w-full h-40 object-cover">
                </div>
                <div class="flex justify-center gap-1.5 mt-3">
                    <span class="w-5 h-1.5 rounded-full" style="background: var(--mp-rose-gold);"></span>
                    <span class="w-1.5 h-1.5 rounded-full" style="background: var(--mp-border);"></span>
                    <span class="w-1.5 h-1.5 rounded-full" style="background: var(--mp-border);"></span>
                    <span class="w-1.5 h-1.5 rounded-full" style="background: var(--mp-border);"></span>
                </div>
            </section>

            <!-- ═══ 5. QUICK ENTRY GRID ═══ -->
            <section>
                <div class="grid grid-cols-4 gap-2">
                    <!-- 颜库 -->
                    <button class="flex flex-col items-center gap-1.5 py-2">
                        <div class="w-14 h-14 rounded-full flex items-center justify-center"
                             style="background: rgba(196, 149, 106, 0.10);">
                            <i data-lucide="palette" class="w-6 h-6" style="color: var(--mp-rose-gold);"></i>
                        </div>
                        <span class="text-xs font-medium" style="color: var(--mp-text-secondary); font-family: var(--mp-font-cn);">颜库</span>
                    </button>
                    <!-- 焕新 -->
                    <button class="flex flex-col items-center gap-1.5 py-2">
                        <div class="w-14 h-14 rounded-full flex items-center justify-center"
                             style="background: rgba(255, 140, 66, 0.10);">
                            <i data-lucide="sparkles" class="w-6 h-6" style="color: var(--mp-sunset);"></i>
                        </div>
                        <span class="text-xs font-medium" style="color: var(--mp-text-secondary); font-family: var(--mp-font-cn);">焕新</span>
                    </button>
                    <!-- 市集 -->
                    <button class="flex flex-col items-center gap-1.5 py-2">
                        <div class="w-14 h-14 rounded-full flex items-center justify-center"
                             style="background: rgba(196, 149, 106, 0.10);">
                            <i data-lucide="shopping-bag" class="w-6 h-6" style="color: var(--mp-rose-gold);"></i>
                        </div>
                        <span class="text-xs font-medium" style="color: var(--mp-text-secondary); font-family: var(--mp-font-cn);">市集</span>
                    </button>
                    <!-- 闺蜜 -->
                    <button class="flex flex-col items-center gap-1.5 py-2">
                        <div class="w-14 h-14 rounded-full flex items-center justify-center"
                             style="background: rgba(255, 140, 66, 0.10);">
                            <i data-lucide="heart" class="w-6 h-6" style="color: var(--mp-sunset);"></i>
                        </div>
                        <span class="text-xs font-medium" style="color: var(--mp-text-secondary); font-family: var(--mp-font-cn);">闺蜜</span>
                    </button>
                </div>
            </section>

            <!-- ═══ 6. RECOMMENDED FEED SECTION ═══ -->
            <section>
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-base font-semibold" style="color: var(--mp-text-primary); font-family: var(--mp-font-cn);">为你推荐</h2>
                    <button class="text-xs" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-cn);">
                        查看全部 <i data-lucide="chevron-right" class="w-3 h-3 inline-block align-middle"></i>
                    </button>
                </div>
                <div class="flex gap-3 overflow-x-auto no-scrollbar -mx-4 px-4 pb-1">

                    <!-- Card 1 -->
                    <article class="shrink-0 w-44 rounded-2xl overflow-hidden" style="border-radius: var(--mp-radius-lg); box-shadow: var(--mp-shadow-xs); background: var(--mp-bg-white);">
                        <img src="../assets/image_1_yi19x4.jpg" alt="秋冬暖色妆容教程" class="w-full h-24 object-cover">
                        <div class="p-3">
                            <p class="text-xs font-semibold truncate" style="color: var(--mp-text-primary); font-family: var(--mp-font-cn);">秋冬暖色妆容教程</p>
                            <div class="flex items-center gap-2 mt-2">
                                <img src="../assets/image_2_yi19x4.jpg" alt="作者头像" class="w-5 h-5 rounded-full object-cover">
                                <span class="text-xs truncate" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-cn);">美妆小鲸</span>
                            </div>
                            <div class="flex items-center gap-1 mt-1.5">
                                <i data-lucide="heart" class="w-3 h-3" style="color: var(--mp-rose-gold);"></i>
                                <span class="text-xs" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-display);">2.3k</span>
                            </div>
                        </div>
                    </article>

                    <!-- Card 2 -->
                    <article class="shrink-0 w-44 rounded-2xl overflow-hidden" style="border-radius: var(--mp-radius-lg); box-shadow: var(--mp-shadow-xs); background: var(--mp-bg-white);">
                        <img src="../assets/image_1_yi19x4.jpg" alt="通勤自然底妆技巧" class="w-full h-24 object-cover">
                        <div class="p-3">
                            <p class="text-xs font-semibold truncate" style="color: var(--mp-text-primary); font-family: var(--mp-font-cn);">通勤自然底妆技巧</p>
                            <div class="flex items-center gap-2 mt-2">
                                <img src="../assets/image_2_yi19x4.jpg" alt="作者头像" class="w-5 h-5 rounded-full object-cover">
                                <span class="text-xs truncate" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-cn);">桃子酱</span>
                            </div>
                            <div class="flex items-center gap-1 mt-1.5">
                                <i data-lucide="heart" class="w-3 h-3" style="color: var(--mp-rose-gold);"></i>
                                <span class="text-xs" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-display);">1.8k</span>
                            </div>
                        </div>
                    </article>

                    <!-- Card 3 -->
                    <article class="shrink-0 w-44 rounded-2xl overflow-hidden" style="border-radius: var(--mp-radius-lg); box-shadow: var(--mp-shadow-xs); background: var(--mp-bg-white);">
                        <img src="../assets/image_1_yi19x4.jpg" alt="蜜桃腮红画法解析" class="w-full h-24 object-cover">
                        <div class="p-3">
                            <p class="text-xs font-semibold truncate" style="color: var(--mp-text-primary); font-family: var(--mp-font-cn);">蜜桃腮红画法解析</p>
                            <div class="flex items-center gap-2 mt-2">
                                <img src="../assets/image_2_yi19x4.jpg" alt="作者头像" class="w-5 h-5 rounded-full object-cover">
                                <span class="text-xs truncate" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-cn);">林小鹿</span>
                            </div>
                            <div class="flex items-center gap-1 mt-1.5">
                                <i data-lucide="heart" class="w-3 h-3" style="color: var(--mp-rose-gold);"></i>
                                <span class="text-xs" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-display);">956</span>
                            </div>
                        </div>
                    </article>

                    <!-- Card 4 -->
                    <article class="shrink-0 w-44 rounded-2xl overflow-hidden" style="border-radius: var(--mp-radius-lg); box-shadow: var(--mp-shadow-xs); background: var(--mp-bg-white);">
                        <img src="../assets/image_1_yi19x4.jpg" alt="立体修容保姆级教程" class="w-full h-24 object-cover">
                        <div class="p-3">
                            <p class="text-xs font-semibold truncate" style="color: var(--mp-text-primary); font-family: var(--mp-font-cn);">立体修容保姆级教程</p>
                            <div class="flex items-center gap-2 mt-2">
                                <img src="../assets/image_2_yi19x4.jpg" alt="作者头像" class="w-5 h-5 rounded-full object-cover">
                                <span class="text-xs truncate" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-cn);">妆娘Yuki</span>
                            </div>
                            <div class="flex items-center gap-1 mt-1.5">
                                <i data-lucide="heart" class="w-3 h-3" style="color: var(--mp-rose-gold);"></i>
                                <span class="text-xs" style="color: var(--mp-text-tertiary); font-family: var(--mp-font-display);">3.1k</span>
                            </div>
                        </div>
                    </article>

                </div>
            </section>

        </div>
    </main>

    <!-- ═══ 7. BOTTOM TAB BAR (PILL STYLE) ═══ -->
    <nav class="fixed bottom-3 left-1/2 -translate-x-1/2 z-50 flex items-center gap-1 px-2 py-1.5"
         style="background: var(--mp-bg-white); border: 1px solid var(--mp-border); border-radius: var(--mp-radius-tab); box-shadow: var(--mp-shadow-md); max-width: 320px;">
        <!-- 首页 (Active) -->
        <button data-dom-id="tab-home" class="flex flex-col items-center justify-center w-12 h-12 rounded-full text-white"
                style="background: var(--mp-gradient-primary); min-width: 48px; min-height: 48px;">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-[10px] mt-0.5 font-medium" style="font-family: var(--mp-font-cn);">首页</span>
        </button>
        <!-- 颜库 -->
        <button data-dom-id="tab-library" class="flex flex-col items-center justify-center w-12 h-12 rounded-full"
                style="min-width: 48px; min-height: 48px; color: var(--mp-text-tertiary);">
            <i data-lucide="palette" class="w-5 h-5"></i>
            <span class="text-[10px] mt-0.5 font-medium" style="font-family: var(--mp-font-cn);">颜库</span>
        </button>
        <!-- 焕新 (Center, Prominent) -->
        <button data-dom-id="tab-mirror" class="flex flex-col items-center justify-center w-12 h-12 rounded-full"
                style="min-width: 48px; min-height: 48px; color: var(--mp-text-tertiary); box-shadow: var(--mp-shadow-sm);">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
            <span class="text-[10px] mt-0.5 font-medium" style="font-family: var(--mp-font-cn);">焕新</span>
        </button>
        <!-- 市集 -->
        <button data-dom-id="tab-mall" class="flex flex-col items-center justify-center w-12 h-12 rounded-full"
                style="min-width: 48px; min-height: 48px; color: var(--mp-text-tertiary);">
            <i data-lucide="shopping-bag" class="w-5 h-5"></i>
            <span class="text-[10px] mt-0.5 font-medium" style="font-family: var(--mp-font-cn);">市集</span>
        </button>
        <!-- 我的 -->
        <button data-dom-id="tab-profile" class="flex flex-col items-center justify-center w-12 h-12 rounded-full"
                style="min-width: 48px; min-height: 48px; color: var(--mp-text-tertiary);">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span class="text-[10px] mt-0.5 font-medium" style="font-family: var(--mp-font-cn);">我的</span>
        </button>
    </nav>

    <!-- ═══ 8. AI FAB BUTTON ═══ -->
    <button data-dom-id="ai-fab-btn"
            class="fixed z-50 flex items-center justify-center w-[52px] h-[52px] rounded-full text-white"
            style="background: var(--mp-gradient-primary); box-shadow: var(--mp-shadow-btn); bottom: 6.5rem; right: 1rem;"
            aria-label="AI 助手">
        <i data-lucide="message-circle" class="w-6 h-6"></i>
    </button>

    <script>lucide.createIcons();</script>
</body>
</html>

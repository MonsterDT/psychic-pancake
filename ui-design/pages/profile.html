    <style id="theme-vars">
/* MakeupPal Brand Design System */
/* Rose Gold + Cream Warm Palette */

:root {
  /* === Brand Colors === */
  --color-primary: #C4956A;
  --color-primary-light: #D4B08A;
  --color-primary-lighter: #E8D5C0;
  --color-primary-lightest: #F5EDE4;
  --color-primary-dark: #A87D56;
  --color-primary-darker: #8B6542;

  /* Background & Surface */
  --color-bg: #FFF8F0;
  --color-bg-secondary: #FFF1E6;
  --color-bg-tertiary: #FFE8D6;
  --color-surface: #FFFFFF;
  --color-surface-elevated: #FFFFFF;

  /* Text */
  --color-text-primary: #2D2A26;
  --color-text-secondary: #6B6560;
  --color-text-tertiary: #9E9790;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #C4956A;

  /* Semantic State Colors */
  --state-success: #4CAF50;
  --state-warning: #FF9800;
  --state-error: #E53935;
  --state-info: #42A5F5;

  /* Border */
  --color-border: #E8DDD2;
  --color-border-light: #F0E8DF;

  /* === Typography === */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --font-family-display: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;

  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 18px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 28px;
  --font-size-4xl: 32px;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  /* === Spacing === */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-base: 16px;
  --spacing-lg: 20px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;
  --spacing-3xl: 40px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadow === */
  --shadow-sm: 0 1px 3px rgba(196, 149, 106, 0.04);
  --shadow-md: 0 2px 8px rgba(196, 149, 106, 0.05);
  --shadow-lg: 0 4px 16px rgba(196, 149, 106, 0.05);
  --shadow-xl: 0 8px 32px rgba(196, 149, 106, 0.05);
  --shadow-card: 0 1px 3px rgba(196, 149, 106, 0.04);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.08);

  /* === Animation === */
  --transition-fast: 0.2s ease;
  --transition-normal: 0.3s ease;
  --transition-slow: 0.4s ease;

  /* === Z-index === */
  --z-tab-bar: 100;
  --z-bottom-sheet: 200;
  --z-modal: 300;
  --z-toast: 400;

  /* === Layout === */
  --tab-bar-height: 56px;
  --header-height: 56px;
  --safe-area-bottom: env(safe-area-inset-bottom, 0px);
  --content-max-width: 414px;
}

/* === Typography Classes === */
.text-xs { font-size: var(--font-size-xs); line-height: var(--line-height-tight); }
.text-sm { font-size: var(--font-size-sm); line-height: var(--line-height-normal); }
.text-base { font-size: var(--font-size-base); line-height: var(--line-height-normal); }
.text-md { font-size: var(--font-size-md); line-height: var(--line-height-normal); }
.text-lg { font-size: var(--font-size-lg); line-height: var(--line-height-normal); }
.text-xl { font-size: var(--font-size-xl); line-height: var(--line-height-tight); }
.text-2xl { font-size: var(--font-size-2xl); line-height: var(--line-height-tight); }
.text-3xl { font-size: var(--font-size-3xl); line-height: var(--line-height-tight); }
.text-4xl { font-size: var(--font-size-4xl); line-height: var(--line-height-tight); }

.font-normal { font-weight: var(--font-weight-normal); }
.font-medium { font-weight: var(--font-weight-medium); }
.font-semibold { font-weight: var(--font-weight-semibold); }
.font-bold { font-weight: var(--font-weight-bold); }

/* === Color Utility Classes === */
.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-tertiary { color: var(--color-text-tertiary); }
.text-brand { color: var(--color-primary); }
.text-brand-dark { color: var(--color-primary-dark); }
.text-success { color: var(--state-success); }
.text-warning { color: var(--state-warning); }
.text-error { color: var(--state-error); }

.bg-page { background-color: var(--color-bg); }
.bg-surface { background-color: var(--color-surface); }
.bg-brand { background-color: var(--color-primary); }
.bg-brand-light { background-color: var(--color-primary-lighter); }
.bg-secondary { background-color: var(--color-bg-secondary); }

/* === Component Classes === */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.card-elevated {
  background: var(--color-surface-elevated);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-medium);
}

.badge-brand {
  background: var(--color-primary-lightest);
  color: var(--color-primary-dark);
}

.badge-success {
  background: #E8F5E9;
  color: #2E7D32;
}

.badge-warning {
  background: #FFF3E0;
  color: #E65100;
}

.badge-error {
  background: #FFEBEE;
  color: #C62828;
}

.bottom-sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: var(--z-bottom-sheet);
  transition: opacity var(--transition-fast);
}

.bottom-sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: var(--content-max-width);
  margin: 0 auto;
  background: var(--color-surface);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.12);
  z-index: calc(var(--z-bottom-sheet) + 1);
  transition: transform var(--transition-fast);
}

.bottom-sheet-handle {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--color-border);
  margin: 8px auto;
}

.skeleton {
  background: linear-gradient(90deg, var(--color-bg-secondary) 25%, var(--color-bg-tertiary) 50%, var(--color-bg-secondary) 75%);
  background-size: 200% 100%;
  animation: skeleton-loading 1.5s infinite;
  border-radius: var(--radius-sm);
}

@keyframes skeleton-loading {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* GP Token Badge */
.gp-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: linear-gradient(135deg, #C4956A, #D4B08A);
  color: white;
  border-radius: var(--radius-full);
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-semibold);
}

/* Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--tab-bar-height);
  background: var(--color-surface);
  border-top: 1px solid var(--color-border-light);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: var(--z-tab-bar);
  padding-bottom: var(--safe-area-bottom);
}

.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: var(--font-size-xs);
  color: var(--color-text-tertiary);
  transition: color var(--transition-fast);
  cursor: pointer;
  padding: 4px 0;
}

.tab-item.active {
  color: var(--color-primary);
}

.tab-item svg {
  width: 24px;
  height: 24px;
}

/* Button Styles */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 24px;
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
  color: white;
  border-radius: var(--radius-full);
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-semibold);
  border: none;
  cursor: pointer;
  transition: all var(--transition-fast);
  box-shadow: 0 2px 8px rgba(196, 149, 106, 0.3);
}

.btn-primary:hover {
  box-shadow: 0 4px 16px rgba(196, 149, 106, 0.4);
  transform: translateY(-1px);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 24px;
  background: var(--color-surface);
  color: var(--color-primary);
  border-radius: var(--radius-full);
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-medium);
  border: 1.5px solid var(--color-primary);
  cursor: pointer;
  transition: all var(--transition-fast);
}

/* Toast */
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(45, 42, 38, 0.85);
  color: white;
  padding: 12px 24px;
  border-radius: var(--radius-md);
  font-size: var(--font-size-base);
  z-index: var(--z-toast);
  backdrop-filter: blur(8px);
}

    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-family);
      background: var(--color-bg);
      color: var(--color-text-primary);
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: calc(var(--tab-bar-height) + var(--safe-area-bottom));
      -webkit-font-smoothing: antialiased;
    }

    /* Profile Header */
    .profile-header {
      background: linear-gradient(135deg, #C4956A, #D4B08A);
      padding: 40px 16px 24px;
      position: relative;
      overflow: hidden;
    }
    .profile-header::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -40px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }
    .profile-header::after {
      content: '';
      position: absolute;
      bottom: -30px;
      left: -20px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
    }

    /* GP Card */
    .gp-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .gp-card .gp-number {
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1;
    }
    .gp-card .gp-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 2px;
    }
    .gp-card .gp-actions {
      display: flex;
      gap: 8px;
    }
    .gp-card .gp-btn {
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .gp-card .gp-btn-primary {
      background: rgba(255, 255, 255, 0.95);
      color: #C4956A;
    }
    .gp-card .gp-btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Feature Cards Grid */
    .feature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px;
      margin-top: -12px;
      position: relative;
      z-index: 2;
    }
    .feature-card {
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(196, 149, 106, 0.10);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .feature-card:active {
      transform: scale(0.97);
    }
    .feature-card .icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .feature-card .icon-wrap svg {
      width: 24px;
      height: 24px;
    }
    .feature-card .card-label {
      font-size: 14px;
      font-weight: 600;
      color: #2D2A26;
    }
    .feature-card .card-subtitle {
      font-size: 11px;
      color: #9E9790;
    }
    .red-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #E53935;
      border: 2px solid #FFFFFF;
    }

    /* Star Face Match Card */
    .star-face-card {
      margin: 0 16px 16px;
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(196, 149, 106, 0.10);
      padding: 16px;
    }
    .star-face-card .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #2D2A26;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .celebrity-list {
      display: flex;
      justify-content: space-around;
      gap: 12px;
    }
    .celebrity-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .celebrity-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .celebrity-avatar .avatar-inner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #F5EDE4;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .celebrity-avatar .avatar-inner svg {
      width: 28px;
      height: 28px;
      color: #C4956A;
    }
    .celebrity-avatar .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
    }
    .celebrity-avatar .ring-gold {
      border-color: #C4956A;
    }
    .celebrity-avatar .ring-light {
      border-color: #D4B08A;
    }
    .celebrity-avatar .ring-lighter {
      border-color: #E8D5C0;
    }
    .celebrity-name {
      font-size: 12px;
      color: #6B6560;
    }
    .celebrity-match {
      font-size: 11px;
      color: #C4956A;
      font-weight: 600;
    }
    .view-report-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 16px;
      padding-top: 12px;

      font-size: 13px;
      color: #C4956A;
      font-weight: 500;
      cursor: pointer;
    }
    .view-report-link svg {
      width: 14px;
      height: 14px;
    }

    /* Settings List */
    .settings-section {
      margin: 0 16px 16px;
    }
    .settings-section-title {
      font-size: 12px;
      color: #9E9790;
      font-weight: 500;
      padding: 0 4px 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .settings-group {
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(196, 149, 106, 0.10);
      overflow: hidden;
    }
    .settings-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      transition: background 0.15s ease;
      position: relative;
    }
    .settings-item:active {
      background: #FFF8F0;
    }
    .settings-item:not(:last-child)::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 52px;
      right: 16px;
      height: 1px;
      background: #F0E8DF;
    }
    .settings-item .item-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .settings-item .item-icon svg {
      width: 18px;
      height: 18px;
    }
    .settings-item .item-text {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      color: #2D2A26;
    }
    .settings-item .item-badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      background: linear-gradient(135deg, #C4956A, #D4B08A);
      color: #FFFFFF;
      margin-right: 8px;
    }
    .settings-item .item-arrow {
      width: 16px;
      height: 16px;
      color: #C4C0BC;
      flex-shrink: 0;
    }

    /* Bottom Tab Bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px;
      height: 56px;
      background: #FFFFFF;
      border-top: 1px solid #F0E8DF;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      color: #9E9790;
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.2s ease;
      text-decoration: none;
    }
    .tab-item.active {
      color: #C4956A;
    }
    .tab-item svg {
      width: 24px;
      height: 24px;
    }
  </style>
</body>

    <style id="theme-vars">
/* MakeupPal Brand Design System */
/* Rose Gold + Cream Warm Palette */

:root {
  /* === Brand Colors === */
  --color-primary: #C4956A;
  --color-primary-light: #D4B08A;
  --color-primary-lighter: #E8D5C0;
  --color-primary-lightest: #F5EDE4;
  --color-primary-dark: #A87D56;
  --color-primary-darker: #8B6542;

  /* Background & Surface */
  --color-bg: #FFF8F0;
  --color-bg-secondary: #FFF1E6;
  --color-bg-tertiary: #FFE8D6;
  --color-surface: #FFFFFF;
  --color-surface-elevated: #FFFFFF;

  /* Text */
  --color-text-primary: #2D2A26;
  --color-text-secondary: #6B6560;
  --color-text-tertiary: #9E9790;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #C4956A;

  /* Semantic State Colors */
  --state-success: #4CAF50;
  --state-warning: #FF9800;
  --state-error: #E53935;
  --state-info: #42A5F5;

  /* Border */
  --color-border: #E8DDD2;
  --color-border-light: #F0E8DF;

  /* === Typography === */
  --font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --font-family-display: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;

  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 18px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 28px;
  --font-size-4xl: 32px;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  /* === Spacing === */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-base: 16px;
  --spacing-lg: 20px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;
  --spacing-3xl: 40px;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadow === */
  --shadow-sm: 0 1px 3px rgba(196, 149, 106, 0.04);
  --shadow-md: 0 2px 8px rgba(196, 149, 106, 0.05);
  --shadow-lg: 0 4px 16px rgba(196, 149, 106, 0.05);
  --shadow-xl: 0 8px 32px rgba(196, 149, 106, 0.05);
  --shadow-card: 0 1px 3px rgba(196, 149, 106, 0.04);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.08);

  /* === Animation === */
  --transition-fast: 0.2s ease;
  --transition-normal: 0.3s ease;
  --transition-slow: 0.4s ease;

  /* === Z-index === */
  --z-tab-bar: 100;
  --z-bottom-sheet: 200;
  --z-modal: 300;
  --z-toast: 400;

  /* === Layout === */
  --tab-bar-height: 56px;
  --header-height: 56px;
  --safe-area-bottom: env(safe-area-inset-bottom, 0px);
  --content-max-width: 414px;
}

/* === Typography Classes === */
.text-xs { font-size: var(--font-size-xs); line-height: var(--line-height-tight); }
.text-sm { font-size: var(--font-size-sm); line-height: var(--line-height-normal); }
.text-base { font-size: var(--font-size-base); line-height: var(--line-height-normal); }
.text-md { font-size: var(--font-size-md); line-height: var(--line-height-normal); }
.text-lg { font-size: var(--font-size-lg); line-height: var(--line-height-normal); }
.text-xl { font-size: var(--font-size-xl); line-height: var(--line-height-tight); }
.text-2xl { font-size: var(--font-size-2xl); line-height: var(--line-height-tight); }
.text-3xl { font-size: var(--font-size-3xl); line-height: var(--line-height-tight); }
.text-4xl { font-size: var(--font-size-4xl); line-height: var(--line-height-tight); }

.font-normal { font-weight: var(--font-weight-normal); }
.font-medium { font-weight: var(--font-weight-medium); }
.font-semibold { font-weight: var(--font-weight-semibold); }
.font-bold { font-weight: var(--font-weight-bold); }

/* === Color Utility Classes === */
.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-tertiary { color: var(--color-text-tertiary); }
.text-brand { color: var(--color-primary); }
.text-brand-dark { color: var(--color-primary-dark); }
.text-success { color: var(--state-success); }
.text-warning { color: var(--state-warning); }
.text-error { color: var(--state-error); }

.bg-page { background-color: var(--color-bg); }
.bg-surface { background-color: var(--color-surface); }
.bg-brand { background-color: var(--color-primary); }
.bg-brand-light { background-color: var(--color-primary-lighter); }
.bg-secondary { background-color: var(--color-bg-secondary); }

/* === Component Classes === */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.card-elevated {
  background: var(--color-surface-elevated);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-size: var(--font-size-xs);
  font-weight: var(--font-weight-medium);
}

.badge-brand {
  background: var(--color-primary-lightest);
  color: var(--color-primary-dark);
}

.badge-success {
  background: #E8F5E9;
  color: #2E7D32;
}

.badge-warning {
  background: #FFF3E0;
  color: #E65100;
}

.badge-error {
  background: #FFEBEE;
  color: #C62828;
}

.bottom-sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: var(--z-bottom-sheet);
  transition: opacity var(--transition-fast);
}

.bottom-sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: var(--content-max-width);
  margin: 0 auto;
  background: var(--color-surface);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.12);
  z-index: calc(var(--z-bottom-sheet) + 1);
  transition: transform var(--transition-fast);
}

.bottom-sheet-handle {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--color-border);
  margin: 8px auto;
}

.skeleton {
  background: linear-gradient(90deg, var(--color-bg-secondary) 25%, var(--color-bg-tertiary) 50%, var(--color-bg-secondary) 75%);
  background-size: 200% 100%;
  animation: skeleton-loading 1.5s infinite;
  border-radius: var(--radius-sm);
}

@keyframes skeleton-loading {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* GP Token Badge */
.gp-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: linear-gradient(135deg, #C4956A, #D4B08A);
  color: white;
  border-radius: var(--radius-full);
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-semibold);
}

/* Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--tab-bar-height);
  background: var(--color-surface);
  border-top: 1px solid var(--color-border-light);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: var(--z-tab-bar);
  padding-bottom: var(--safe-area-bottom);
}

.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: var(--font-size-xs);
  color: var(--color-text-tertiary);
  transition: color var(--transition-fast);
  cursor: pointer;
  padding: 4px 0;
}

.tab-item.active {
  color: var(--color-primary);
}

.tab-item svg {
  width: 24px;
  height: 24px;
}

/* Button Styles */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 24px;
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
  color: white;
  border-radius: var(--radius-full);
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-semibold);
  border: none;
  cursor: pointer;
  transition: all var(--transition-fast);
  box-shadow: 0 2px 8px rgba(196, 149, 106, 0.3);
}

.btn-primary:hover {
  box-shadow: 0 4px 16px rgba(196, 149, 106, 0.4);
  transform: translateY(-1px);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 24px;
  background: var(--color-surface);
  color: var(--color-primary);
  border-radius: var(--radius-full);
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-medium);
  border: 1.5px solid var(--color-primary);
  cursor: pointer;
  transition: all var(--transition-fast);
}

/* Toast */
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(45, 42, 38, 0.85);
  color: white;
  padding: 12px 24px;
  border-radius: var(--radius-md);
  font-size: var(--font-size-base);
  z-index: var(--z-toast);
  backdrop-filter: blur(8px);
}

  <!-- ========== JavaScript ========== -->
  <script>
    function toggleAccordion(header) {
      const card = header.closest('.card');
      const body = card.querySelector('.accordion-body');
      const chevron = header.querySelector('.chevron-icon');

      if (body.classList.contains('open')) {
        body.classList.remove('open');
        chevron.classList.remove('rotated');
      } else {
        body.classList.add('open');
        chevron.classList.add('rotated');
      }
    }

    // Category tag toggle
    document.querySelectorAll('.category-scroll button').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.category-scroll button').forEach(b => {
          b.style.background = 'var(--color-primary-lightest)';
          b.style.color = 'var(--color-text-secondary)';
        });
        this.style.background = 'var(--color-primary)';
        this.style.color = 'var(--color-text-inverse)';
      });
    });
  </script>


    <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-family);
      background: var(--color-bg);
      color: var(--color-text-primary);
      margin: 0;
      padding: 0;
      max-width: 414px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* Search bar focus ring */
    .search-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(196, 149, 106, 0.25);
    }

    /* Category scroll hide scrollbar */
    .category-scroll::-webkit-scrollbar { display: none; }
    .category-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* Accordion transition */
    .accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.2s ease;
      opacity: 0;
    }
    .accordion-body.open {
      max-height: 600px;
      opacity: 1;
    }

    /* Chevron rotation */
    .chevron-icon {
      transition: transform 0.2s ease;
    }
    .chevron-icon.rotated {
      transform: rotate(180deg);
    }

    /* Solution card hover */
    .solution-card {
      transition: all 0.2s ease;
    }
    .solution-card:active {
      transform: scale(0.98);
      background: var(--color-bg-secondary);
    }

    /* Risk warning pulse */
    @keyframes pulse-border {
      0%, 100% { border-color: #E53935; }
      50% { border-color: #FF6F60; }
    }
    .risk-card {
      animation: pulse-border 3s ease-in-out infinite;
    }

    /* Tab bar active indicator */
    .tab-item.active::after {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 2px;
      background: var(--color-primary);
      border-radius: 1px;
    }
    .tab-item { position: relative; }
  </style>
